<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Método das Folhas — Matemática do zero ao cálculo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F2EEE4;
    --paper-line: rgba(62,92,118,0.14);
    --paper-margin: rgba(193,68,61,0.35);
    --ink: #23303D;
    --ink-soft: #4C5A68;
    --slate: #3E5C76;
    --slate-deep: #2A4258;
    --red-pen: #C1443D;
    --check-green: #4C7A62;
    --gold: #B8862E;
    --silver: #8C97A0;
    --bronze: #A9714A;
    --muted: #A9A08D;
    --card-bg: #FBF9F4;
    --shadow: 0 1px 0 rgba(35,48,61,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', -apple-system, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:640px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
  }
  h1,h2,h3{
    font-family:'Source Serif 4', Georgia, serif;
    margin:0;
    color:var(--ink);
    font-weight:600;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  /* ---------- Header ---------- */
  .app-header{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--paper-line);
  }
  .app-header h1{
    font-size:1.4rem;
    line-height:1.25;
  }
  .app-header .sub{
    margin-top:4px;
    font-size:0.85rem;
    color:var(--ink-soft);
  }
  .overall-progress{
    margin-top:14px;
  }
  .overall-progress .bar-track{
    height:8px;
    border-radius:4px;
    background:rgba(62,92,118,0.14);
    overflow:hidden;
  }
  .overall-progress .bar-fill{
    height:100%;
    background:var(--slate);
    border-radius:4px;
    transition:width .5s ease;
  }
  .overall-progress .label{
    margin-top:6px;
    font-size:0.78rem;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
  }

  /* ---------- Welcome ---------- */
  .welcome{
    padding:28px 20px 40px;
    flex:1;
  }
  .welcome p{
    font-size:0.95rem;
    line-height:1.6;
    color:var(--ink-soft);
    margin:0 0 14px;
  }
  .welcome .method-points{
    list-style:none;
    padding:0;
    margin:20px 0;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .welcome .method-points li{
    display:flex;
    gap:12px;
    align-items:flex-start;
    font-size:0.9rem;
    color:var(--ink);
    line-height:1.5;
  }
  .welcome .method-points .mark{
    font-family:'IBM Plex Mono', monospace;
    color:var(--red-pen);
    font-weight:600;
    flex-shrink:0;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:13px 22px;
    background:var(--slate);
    color:#fff;
    border:none;
    border-radius:3px;
    font-size:0.95rem;
    font-weight:500;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .btn:active{ background:var(--slate-deep); }
  .btn.secondary{
    background:transparent;
    color:var(--slate);
    border:1px solid var(--slate);
  }
  .btn.ghost{
    background:transparent;
    color:var(--ink-soft);
    border:1px solid var(--paper-line);
  }
  .btn:disabled{ opacity:0.4; cursor:default; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; }

  /* ---------- Map ---------- */
  .map{ padding:16px 16px 40px; flex:1; }
  .stage-card{
    background:var(--card-bg);
    border:1px solid var(--paper-line);
    border-radius:4px;
    margin-bottom:12px;
    overflow:hidden;
  }
  .stage-head{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 16px;
    cursor:pointer;
    user-select:none;
  }
  .stage-num{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.8rem;
    color:var(--muted);
    width:20px;
    flex-shrink:0;
  }
  .stage-head.locked .stage-num,
  .stage-head.locked .stage-title{ color:var(--muted); }
  .stage-title{ flex:1; }
  .stage-title .name{ font-size:0.98rem; font-weight:600; color:var(--ink); }
  .stage-title .tag{ font-size:0.78rem; color:var(--ink-soft); margin-top:2px; }
  .stage-caret{ font-size:0.8rem; color:var(--ink-soft); transition:transform .2s; }
  .stage-card.open .stage-caret{ transform:rotate(90deg); }
  .stage-lock-icon{ font-size:0.9rem; color:var(--muted); }

  .stage-levels{
    display:none;
    flex-wrap:wrap;
    padding:4px 16px 18px;
    gap:7px;
  }
  .stage-card.open .stage-levels{ display:flex; }
  .stage-summary{
    flex:1 0 100%;
    font-size:0.72rem;
    color:var(--ink-soft);
    margin-bottom:2px;
  }
  .level-node{
    width:36px;
    height:36px;
    flex:0 0 auto;
    border:1px solid var(--paper-line);
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    font-weight:600;
    cursor:pointer;
    background:#fff;
    color:var(--ink);
  }
  .level-node.locked{
    cursor:default;
    background:rgba(169,160,141,0.08);
    color:var(--muted);
  }
  .level-node.medal-gold{ border-color:var(--gold); background:rgba(184,134,46,0.12); }
  .level-node.medal-silver{ border-color:var(--check-green); background:rgba(76,122,98,0.10); }
  .level-node.medal-none{ border-color:var(--slate); }

  /* ---------- Worksheet overlay ---------- */
  .worksheet{
    position:fixed;
    inset:0;
    background:var(--paper);
    z-index:20;
    display:flex;
    flex-direction:column;
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 100% 30px, 30px 100%;
  }
  .worksheet::before{
    content:"";
    position:absolute;
    top:0; bottom:0; left:38px;
    width:1px;
    background:var(--paper-margin);
  }
  .ws-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px 12px 50px;
    position:relative;
    z-index:2;
  }
  .ws-header .ws-title{ font-size:0.85rem; color:var(--ink-soft); }
  .ws-header .ws-progress{ font-family:'IBM Plex Mono', monospace; font-size:0.85rem; color:var(--slate); }
  .ws-close{ background:none; border:none; font-size:1.1rem; color:var(--ink-soft); cursor:pointer; padding:4px 8px; }

  .ws-body{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px 30px 20px 60px;
    position:relative;
    z-index:2;
    text-align:center;
  }
  .ws-prompt{
    font-family:'IBM Plex Mono', monospace;
    font-size:1.5rem;
    color:var(--ink);
    white-space:pre-line;
    margin-bottom:26px;
    line-height:1.5;
  }
  .ws-dots{ letter-spacing:6px; font-size:1.6rem; color:var(--slate-deep); }
  .ws-input{
    width:100%;
    max-width:220px;
    font-family:'IBM Plex Mono', monospace;
    font-size:1.4rem;
    text-align:center;
    border:none;
    border-bottom:2px solid var(--slate);
    background:transparent;
    padding:6px 4px;
    color:var(--ink);
    outline:none;
  }
  .ws-input:focus{ border-bottom-color:var(--red-pen); }
  .ws-mc-options{
    display:flex;
    flex-direction:column;
    gap:10px;
    width:100%;
    max-width:280px;
  }
  .ws-mc-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:1rem;
    padding:11px;
    border:1px solid var(--slate);
    background:#fff;
    border-radius:3px;
    cursor:pointer;
    color:var(--ink);
  }
  .ws-mc-btn.selected{ background:var(--slate); color:#fff; }

  .ws-feedback{
    margin-top:22px;
    min-height:70px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .ws-stamp{
    font-size:2.2rem;
    animation: stampIn .28s cubic-bezier(.2,1.6,.4,1);
  }
  .ws-stamp.correct{ color:var(--check-green); }
  .ws-stamp.wrong{ color:var(--red-pen); }
  @keyframes stampIn{
    0%{ transform:scale(2) rotate(-8deg); opacity:0; }
    100%{ transform:scale(1) rotate(-8deg); opacity:1; }
  }
  .ws-correct-answer{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.85rem;
    color:var(--red-pen);
  }
  .ws-footer{
    padding:18px 20px 26px 60px;
    position:relative;
    z-index:2;
  }

  /* ---------- Results ---------- */
  .results{
    position:fixed;
    inset:0;
    background:var(--paper);
    z-index:25;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:30px;
    text-align:center;
  }
  .results .medal-icon{ font-size:3rem; margin-bottom:10px; }
  .results h2{ font-size:1.3rem; margin-bottom:6px; }
  .results .rmsg{ color:var(--ink-soft); font-size:0.9rem; margin-bottom:20px; }
  .stat-row{
    display:flex;
    gap:24px;
    margin-bottom:26px;
  }
  .stat{ text-align:center; }
  .stat .num{ font-family:'IBM Plex Mono', monospace; font-size:1.3rem; color:var(--slate-deep); font-weight:600; }
  .stat .lbl{ font-size:0.72rem; color:var(--ink-soft); margin-top:2px; }

  .footnote{
    padding:16px 20px 30px;
    font-size:0.75rem;
    color:var(--ink-soft);
    line-height:1.5;
    border-top:1px solid var(--paper-line);
  }
  .footnote button{
    background:none;
    border:none;
    color:var(--slate);
    text-decoration:underline;
    cursor:pointer;
    font-size:0.75rem;
    padding:0;
  }

  /* ---------- Laboratório visual ---------- */
  .lab{ padding:12px 16px 48px; }
  .lab-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .lab-back{ background:none; border:none; color:var(--slate); font:500 0.92rem 'Inter',sans-serif; padding:10px 0; cursor:pointer; }
  .app-header .lab-back{ margin:-6px 0 4px; }
  .lab-count{ font-size:0.78rem; color:var(--ink-soft); }
  .lab-stage{ font-size:0.8rem; color:var(--ink-soft); }
  .lab-head h2{ font-size:1.45rem; line-height:1.2; margin:2px 0 8px; }
  .lab-idea{ margin:0 0 16px; font-size:0.92rem; line-height:1.6; color:var(--ink-soft); max-width:62ch; }
  .lab-challenge{
    background:var(--card-bg); border:1px solid var(--paper-line); border-left:3px solid var(--red-pen);
    border-radius:4px; padding:12px 14px; font-size:0.96rem; line-height:1.5; margin-bottom:14px;
  }
  .lab-challenge strong{ display:block; font-size:0.8rem; font-weight:600; color:var(--red-pen); margin-bottom:2px; }
  .lab-view{ background:#FFFDF8; border:1px solid var(--paper-line); border-radius:4px; padding:12px; margin-bottom:16px; }
  .lab-view svg{ display:block; width:100%; height:auto; max-height:64vh; margin:0 auto; touch-action:manipulation; -webkit-user-select:none; user-select:none; }
  .lab-view svg .seg, .lab-view svg .cell{ cursor:pointer; }
  .lab-view svg .seg:focus{ outline:none; }
  .lab-view svg .seg:focus-visible{ stroke:var(--red-pen); stroke-width:3; }
  .svg-lbl{ font:600 11px 'Inter',sans-serif; fill:#4C5A68; }
  .svg-empty{ font:italic 10px 'Inter',sans-serif; fill:#A9A08D; }
  .svg-num{ font:9px 'IBM Plex Mono',monospace; fill:#4C5A68; }
  .svg-tag{ font:600 11px 'IBM Plex Mono',monospace; }
  .svg-x{ font:700 14px 'IBM Plex Mono',monospace; fill:#fff; }
  .svg-area{ font:600 14px 'IBM Plex Mono',monospace; fill:#23303D; }
  .lab-readout{ margin-top:12px; font-size:0.92rem; line-height:1.7; color:var(--ink); }
  .lab-readout .mono{ font-family:'IBM Plex Mono',monospace; }
  .lab-big{ font-family:'IBM Plex Mono',monospace; font-size:1.5rem; font-weight:600; color:var(--slate-deep); line-height:1.2; }
  .lab-eq{ font-size:1.25rem; font-weight:600; }
  .eq-ok{ color:var(--check-green); }
  .eq-bad{ color:var(--red-pen); }
  .lab-note{ color:var(--red-pen); font-size:0.86rem; }
  .lab-muted{ color:var(--muted); font-style:italic; }
  .lab-found{ margin-top:4px; }
  .chip{ display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:0.82rem; padding:1px 9px; border:1px solid var(--check-green); color:var(--check-green); border-radius:12px; margin:2px 4px 2px 0; }
  .lab-controls{ display:flex; flex-direction:column; gap:14px; margin-bottom:18px; }
  .lab-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .lab-btn{
    font:500 0.88rem 'Inter',sans-serif; padding:10px 12px; min-height:44px;
    border:1px solid var(--slate); background:#fff; color:var(--slate-deep); border-radius:3px; cursor:pointer;
  }
  .lab-btn:active:not(:disabled){ background:var(--slate); color:#fff; }
  .lab-btn:disabled{ opacity:.35; cursor:default; }
  .lab-btn.mono{ font-family:'IBM Plex Mono',monospace; font-size:1rem; min-width:56px; }
  .lab-btn.ghost{ border-color:var(--paper-line); color:var(--ink-soft); }
  .lab-btn.warn{ border-color:var(--red-pen); color:var(--red-pen); }
  .lab-stepper{ display:flex; align-items:center; gap:8px; }
  .lst-label{ flex:1; font-size:0.9rem; }
  .lst-btn{ width:46px; height:46px; font-size:1.3rem; border:1px solid var(--slate); background:#fff; color:var(--slate-deep); border-radius:3px; cursor:pointer; }
  .lst-btn:disabled{ opacity:.3; cursor:default; }
  .lst-val{ font-family:'IBM Plex Mono',monospace; min-width:34px; text-align:center; font-size:1.1rem; font-weight:600; }
  .lab-slider{ display:flex; flex-direction:column; gap:2px; font-size:0.9rem; }
  .lab-slider output{ font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--slate-deep); }
  .lab-slider input[type=range]{ width:100%; height:34px; accent-color:var(--slate); margin:0; }
  .lab-hint{ margin:0; font-size:0.82rem; color:var(--ink-soft); }
  .lab-answer{ display:flex; align-items:center; gap:12px; font-size:0.92rem; margin-bottom:6px; }
  .lab-answer input{
    width:130px; font:500 1.15rem 'IBM Plex Mono',monospace; text-align:center; padding:6px 4px;
    border:none; border-bottom:2px solid var(--slate); background:transparent; color:var(--ink); outline:none;
  }
  .lab-answer input:focus{ border-bottom-color:var(--red-pen); }
  .lab-actions .btn-row{ margin-top:10px; }
  .lab-feedback{ min-height:28px; margin-top:14px; font-size:0.93rem; line-height:1.55; }
  .lab-feedback .ok{ color:var(--check-green); }
  .lab-feedback .wrong{ color:var(--red-pen); }
  .lab-feedback .partial{ color:var(--slate-deep); }
  .lab-stamp{ font-size:1.3rem; margin-right:6px; vertical-align:-2px; }

  /* entrada do laboratório no mapa e na lista */
  .lab-entry, .lab-card{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    background:var(--card-bg); border:1px solid var(--paper-line); border-radius:4px;
    padding:12px 14px; cursor:pointer; font:inherit; color:var(--ink);
  }
  .lab-entry{ margin-top:16px; border-color:var(--slate); }
  .lab-card{ margin-bottom:10px; }
  .lab-entry svg, .lab-card svg{ width:44px; height:44px; flex-shrink:0; }
  .lc-text{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .lc-text .name{ font-weight:600; font-size:0.98rem; }
  .lc-text .tag{ font-size:0.8rem; color:var(--ink-soft); line-height:1.4; }
  .lc-count{ margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:0.8rem; color:var(--check-green); white-space:nowrap; }
  .lc-go{ margin-left:auto; color:var(--slate); font-size:1.2rem; }
  .stage-lab-link{
    flex:1 0 100%; display:flex; align-items:center; gap:10px; text-align:left;
    background:none; border:none; border-bottom:1px dashed var(--paper-line);
    padding:4px 0 12px; margin-bottom:6px; color:var(--slate-deep); font:500 0.86rem 'Inter',sans-serif; cursor:pointer;
  }
  .stage-lab-link svg{ width:30px; height:30px; flex-shrink:0; }
  button:focus-visible, input:focus-visible{ outline:2px solid var(--red-pen); outline-offset:2px; }

  /* ---------- Etnomatemática ---------- */
  .lab-level{ display:inline-block; font-size:0.74rem; font-weight:600; color:var(--slate-deep); background:rgba(62,92,118,0.10); border-radius:10px; padding:1px 9px; margin:0 0 8px; align-self:flex-start; }
  .lab-culture{ background:#F6EEDF; border-left:3px solid var(--gold); border-radius:4px; padding:11px 14px; margin:0 0 16px; font-size:0.88rem; line-height:1.6; color:var(--ink); }
  .lab-culture strong{ display:block; font-size:0.8rem; color:#8C6420; margin-bottom:2px; }
  .lab-section{ font-size:1.2rem; margin:26px 0 4px; }
  .lab-section-sub{ font-size:0.86rem; color:var(--ink-soft); line-height:1.55; margin:0 0 14px; }
  .lab-group{ border:1px solid var(--paper-line); border-radius:4px; padding:10px 12px; display:flex; flex-direction:column; gap:8px; }
  .lab-group-title{ font-size:0.82rem; font-weight:600; color:var(--ink-soft); }
  .lab-choices{ display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:8px; }
  .lab-choice{ text-align:left; padding:10px 12px; min-height:56px; border:1px solid var(--slate); background:#fff; color:var(--ink); border-radius:4px; cursor:pointer; font:inherit; display:flex; flex-direction:column; gap:2px; }
  .lab-choice strong{ font-size:0.88rem; }
  .lab-choice span{ font-size:0.76rem; color:var(--ink-soft); line-height:1.35; }
  .lab-choice.on{ background:var(--slate); color:#fff; }
  .lab-choice.on span{ color:#E6ECF1; }
  .lab-strip-label{ font-size:0.8rem; font-weight:600; color:var(--ink-soft); margin:4px 0 4px; }
  .lab-strip-label + svg{ margin-bottom:10px !important; }

  /* ---------- Soroban ---------- */
  .sb-bar{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .sb-bar .bar-track{ flex:1; height:8px; border-radius:4px; background:rgba(62,92,118,0.14); overflow:hidden; }
  .sb-bar .bar-fill{ height:100%; background:var(--check-green); }
  .sb-bar .lab-btn{ min-height:38px; padding:6px 10px; font-size:0.8rem; }
  .sb-grid{ display:grid; grid-template-columns:repeat(10, 1fr); gap:5px; margin-bottom:8px; }
  .sb-node{ aspect-ratio:1; min-height:30px; font:600 0.72rem 'IBM Plex Mono',monospace; border:1px solid var(--paper-line); background:#fff; color:var(--ink); border-radius:3px; cursor:pointer; padding:0; }
  .sb-node.done{ border-color:var(--check-green); background:rgba(76,122,98,0.14); color:var(--check-green); }
  .sb-node.cur{ outline:2px solid var(--red-pen); outline-offset:1px; }
  .sb-legend{ font-size:0.74rem; color:var(--ink-soft); line-height:1.5; margin-bottom:14px; }
  .lab-hl{ font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--slate-deep); white-space:nowrap; }
  .map-section{ font-size:1.15rem; margin:22px 2px 2px; }
  .map-section:first-child{ margin-top:4px; }
  .map-section-sub{ font-size:0.84rem; color:var(--ink-soft); line-height:1.5; margin:0 2px 12px; }
  /* ---------- Lições ---------- */
  .ws-actions{ display:flex; align-items:center; gap:4px; flex-shrink:0; }
  .ws-header .ws-close{ white-space:nowrap; }
  .ws-help{ background:#fff; border:1px solid var(--slate); color:var(--slate-deep); font:500 0.8rem 'Inter',sans-serif; border-radius:14px; padding:6px 11px; cursor:pointer; }
  .ws-learn{ margin-top:6px; background:none; border:none; color:var(--slate); text-decoration:underline; font:500 0.9rem 'Inter',sans-serif; cursor:pointer; padding:6px; }
  .ws-intro{ flex:1; overflow-y:auto; padding:2px 18px 22px 52px; position:relative; z-index:2; }
  .ws-intro h2{ font-size:1.35rem; margin:2px 0 6px; }
  .ws-intro-sub{ font-size:0.88rem; color:var(--ink-soft); line-height:1.55; margin:0 0 14px; max-width:60ch; }

  details.lesson summary{ cursor:pointer; padding:13px 14px; font-weight:600; font-size:0.98rem; list-style:none; display:flex; justify-content:space-between; gap:10px; }

<body>
<div class="app" id="app"></div>

<script>
/* ============ Utilities ============ */
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; }
function lcm(a,b){ return Math.abs(a*b)/gcd(a,b); }
function simplifyFraction(n,d){ if(n===0) return [0,1]; const g=gcd(n,d); return [n/g, d/g]; }
function normalizeAnswer(s){ return String(s).trim().toLowerCase().replace(/\s+/g,'').replace(',', '.'); }
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=randInt(0,i); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function formatDecimalClean(x){ let s=x.toFixed(2); if(s.endsWith('0')) s=s.slice(0,-1); if(s.endsWith('.')) s=s.slice(0,-1); return s; }

/* ============ Question generators ============ */
function genCount10(){
  const n = randInt(1,10);
  return { prompt:`Quantos pontos você vê?\n\n${'●'.repeat(n)}`, type:'number', answer:n };
}
function genNeighbor50(){
  const n = randInt(2,49);
  if(Math.random()<0.5) return { prompt:`Qual número vem depois de ${n}?`, type:'number', answer:n+1 };
  return { prompt:`Qual número vem antes de ${n}?`, type:'number', answer:n-1 };
}
function genSkip10(){
  const start = randInt(1,60);
  return { prompt:`Complete a sequência:\n${start}, ${start+10}, ${start+20}, ___`, type:'number', answer:start+30 };
}
function genAddSub20(){
  if(Math.random()<0.5){
    const a=randInt(1,9), b=randInt(1,9);
    return { prompt:`${a} + ${b} =`, type:'number', answer:a+b };
  }
  const a=randInt(1,18), b=randInt(0,a);
  return { prompt:`${a} − ${b} =`, type:'number', answer:a-b };
}
function genAddSub100(){
  if(Math.random()<0.5){
    const a=randInt(10,89); const b=randInt(10, Math.max(10, 99-a));
    return { prompt:`${a} + ${b} =`, type:'number', answer:a+b };
  }
  const a=randInt(20,99); const b=randInt(10,a);
  return { prompt:`${a} − ${b} =`, type:'number', answer:a-b };
}
function genAddSub999(){
  if(Math.random()<0.5){
    const a=randInt(100,899); const b=randInt(50, Math.max(50, 999-a));
    return { prompt:`${a} + ${b} =`, type:'number', answer:a+b };
  }
  const a=randInt(200,999); const b=randInt(100,a);
  return { prompt:`${a} − ${b} =`, type:'number', answer:a-b };
}
function genMul5(){ const a=randInt(1,5), b=randInt(1,5); return { prompt:`${a} × ${b} =`, type:'number', answer:a*b }; }
function genMul10(){ const a=randInt(6,10), b=randInt(1,10); return { prompt:`${a} × ${b} =`, type:'number', answer:a*b }; }
function genDiv(){ const b=randInt(2,10), k=randInt(2,10), a=b*k; return { prompt:`${a} ÷ ${b} =`, type:'number', answer:k }; }

function genFracCompare(){
  const d=randInt(3,10); let n1=randInt(1,d-1), n2=randInt(1,d-1);
  while(n2===n1) n2=randInt(1,d-1);
  const bigger = n1>n2 ? `${n1}/${d}` : `${n2}/${d}`;
  return { prompt:`Qual fração é maior: ${n1}/${d} ou ${n2}/${d}?`, type:'text', answer:bigger };
}
function genFracSameDen(){
  const d=randInt(4,12); const n1=randInt(1,d-2); const n2=randInt(1,d-1-n1);
  const [sn,sd]=simplifyFraction(n1+n2, d);
  const answer = sd===1 ? `${sn}` : `${sn}/${sd}`;
  return { prompt:`${n1}/${d} + ${n2}/${d} = ?  (forma simplificada)`, type:'text', answer };
}
function genFracDiffDen(){
  let d1=randInt(2,6), d2=randInt(2,6);
  while(d2===d1) d2=randInt(2,6);
  const n1=randInt(1,d1-1), n2=randInt(1,d2-1);
  const L=lcm(d1,d2);
  const sumN = n1*(L/d1) + n2*(L/d2);
  const [sn,sd]=simplifyFraction(sumN, L);
  const answer = sd===1 ? `${sn}` : `${sn}/${sd}`;
  return { prompt:`${n1}/${d1} + ${n2}/${d2} = ?  (forma simplificada)`, type:'text', answer };
}
function genDecimal(){
  let x=randInt(10,99)/10, y=randInt(10,99)/10;
  const op = Math.random()<0.5?'+':'−';
  if(op==='−' && y>x){ [x,y]=[y,x]; }
  const ans = op==='+' ? +(x+y).toFixed(1) : +(x-y).toFixed(1);
  return { prompt:`${x.toFixed(1)} ${op} ${y.toFixed(1)} =`, type:'number', answer:ans, tolerance:0.05 };
}
function genPercent(){
  const options=[{p:10,mult:10},{p:20,mult:5},{p:25,mult:4},{p:50,mult:2},{p:75,mult:4}];
  const o=options[randInt(0,options.length-1)];
  const base=o.mult*randInt(1,20);
  return { prompt:`Quanto é ${o.p}% de ${base}?`, type:'number', answer: base*o.p/100 };
}
function genConversion(){
  const dOptions=[2,4,5,10];
  const d=dOptions[randInt(0,dOptions.length-1)];
  const n=randInt(1,d-1);
  const [sn,sd]=simplifyFraction(n,d);
  const fracStr=`${sn}/${sd}`;
  const dec=n/d, pct=dec*100;
  if(Math.random()<0.5){
    return { prompt:`Escreva ${fracStr} em forma decimal:`, type:'number', answer:dec, tolerance:0.01 };
  }
  return { prompt:`Escreva ${fracStr} em porcentagem (só o número, sem %):`, type:'number', answer:pct, tolerance:0.5 };
}
function genAlg1(){
  const a=randInt(1,20), x=randInt(-10,20), b=x+a;
  return { prompt:`x + ${a} = ${b}\n\nx = ?`, type:'number', answer:x };
}
function genAlg2(){
  const a=randInt(2,9); let x=randInt(-10,10); if(x===0) x=1; const b=a*x;
  return { prompt:`${a}x = ${b}\n\nx = ?`, type:'number', answer:x };
}
function genAlg3(){
  const a=randInt(2,9), x=randInt(-10,10), b=randInt(-10,10), c=a*x+b;
  const term = b>=0 ? `+ ${b}` : `− ${Math.abs(b)}`;
  return { prompt:`${a}x ${term} = ${c}\n\nx = ?`, type:'number', answer:x };
}
function genPerimeter(){
  const shape=randInt(0,4);
  if(shape===0){ const s=randInt(2,20); return { prompt:`Um quadrado tem lado ${s}.\nQual é o perímetro?`, type:'number', answer:4*s }; }
  if(shape===1){ const w=randInt(2,20), h=randInt(2,20); return { prompt:`Um retângulo tem base ${w} e altura ${h}.\nQual é o perímetro?`, type:'number', answer:2*(w+h) }; }
  if(shape===2){ const s=randInt(2,20); return { prompt:`Um triângulo equilátero tem lado ${s}.\nQual é o perímetro?`, type:'number', answer:3*s }; }
  if(shape===3){ const s=randInt(2,15); return { prompt:`Um pentágono regular tem lado ${s}.\nQual é o perímetro?`, type:'number', answer:5*s }; }
  const s=randInt(2,15); return { prompt:`Um hexágono regular tem lado ${s}.\nQual é o perímetro?`, type:'number', answer:6*s };
}
function genArea(){
  const shape=randInt(0,3);
  if(shape===0){ const s=randInt(2,20); return { prompt:`Um quadrado tem lado ${s}.\nQual é a área?`, type:'number', answer:s*s }; }
  if(shape===1){ const w=randInt(2,20), h=randInt(2,20); return { prompt:`Um retângulo tem base ${w} e altura ${h}.\nQual é a área?`, type:'number', answer:w*h }; }
  if(shape===2){
    let base=randInt(2,20), height=randInt(2,20);
    if((base*height)%2!==0) height+=1;
    return { prompt:`Um triângulo tem base ${base} e altura ${height}.\nQual é a área?`, type:'number', answer:(base*height)/2 };
  }
  let d1=randInt(2,20), d2=randInt(2,20);
  if((d1*d2)%2!==0) d2+=1;
  return { prompt:`Um losango tem diagonais ${d1} e ${d2}.\nQual é a área?`, type:'number', answer:(d1*d2)/2 };
}
function genPythagoras(){
  const triples=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25],[20,21,29],[10,24,26],[12,16,20],[15,20,25]];
  const [a,b,c]=triples[randInt(0,triples.length-1)];
  if(Math.random()<0.5) return { prompt:`Um triângulo retângulo tem catetos ${a} e ${b}.\nQual é a hipotenusa?`, type:'number', answer:c };
  return { prompt:`Um triângulo retângulo tem hipotenusa ${c} e um cateto ${a}.\nQual é o outro cateto?`, type:'number', answer:b };
}
function genEvalFunction(){
  let a=randInt(-6,6); if(a===0) a=2;
  const b=randInt(-10,10), x=randInt(-10,10);
  const term = b>=0 ? `+ ${b}` : `− ${Math.abs(b)}`;
  return { prompt:`f(x) = ${a}x ${term}\n\nQuanto é f(${x})?`, type:'number', answer:a*x+b };
}
function genSlope(){
  const x1=randInt(-5,5); let x2=randInt(-5,5); while(x2===x1) x2=randInt(-5,5);
  let m=randInt(-5,5); if(m===0) m=1;
  const y1=randInt(-10,10); const y2=y1+m*(x2-x1);
  return { prompt:`Qual é a inclinação da reta que passa\npor (${x1}, ${y1}) e (${x2}, ${y2})?`, type:'number', answer:m };
}
function genDerivative(){
  const coeff=randInt(2,9), n=randInt(2,5);
  const newCoeff=coeff*n, newExp=n-1;
  const correctStr = newExp===1 ? `${newCoeff}x` : `${newCoeff}x^${newExp}`;
  const distractorSet = new Set([
    `${coeff}x^${n}`,
    `${coeff}x^${newExp}`,
    `${newCoeff+randInt(1,3)}x^${newExp}`,
    `${newCoeff}x^${n}`
  ]);
  distractorSet.delete(correctStr);
  let opts = Array.from(distractorSet).slice(0,3);
  while(opts.length<3) opts.push(`${newCoeff+opts.length+1}x^${newExp}`);
  const allOpts = shuffle([...opts, correctStr]);
  const correctIndex = allOpts.indexOf(correctStr);
  return { prompt:`Qual é a derivada de ${coeff}x^${n}?`, type:'mc', options:allOpts, answer:correctIndex };
}

/* ---- variantes extras para mais variedade ---- */
function genCompareSmall(){
  let n1=randInt(1,10), n2=randInt(1,10);
  while(n2===n1) n2=randInt(1,10);
  return { prompt:`Qual número é maior: ${n1} ou ${n2}?`, type:'number', answer: Math.max(n1,n2) };
}
function genCompleteTo10(){
  const n=randInt(1,9);
  return { prompt:`Quanto falta para chegar a 10, a partir de ${n}?`, type:'number', answer:10-n };
}
function genSkipGeneric(step){
  const maxStart = step===2 ? 90 : (step===5 ? 80 : 60);
  const start = randInt(1, maxStart);
  return { prompt:`Complete a sequência:\n${start}, ${start+step}, ${start+2*step}, ___`, type:'number', answer:start+3*step };
}
function genSkip5(){ return genSkipGeneric(5); }
function genSkip2(){ return genSkipGeneric(2); }
function genMiddleNumber50(){
  const n=randInt(1,47);
  return { prompt:`Qual número fica entre ${n} e ${n+2}?`, type:'number', answer:n+1 };
}
function genCompare50(){
  let n1=randInt(1,50), n2=randInt(1,50);
  while(n2===n1) n2=randInt(1,50);
  return { prompt:`Qual é maior: ${n1} ou ${n2}?`, type:'number', answer: Math.max(n1,n2) };
}
function genMissingAddend20(){
  const b=randInt(2,18), a=randInt(1,b-1);
  return { prompt:`${a} + ? = ${b}`, type:'number', answer:b-a };
}
function genThreeAddends100(){
  const a=randInt(5,40), b=randInt(5,40);
  const maxC = Math.max(5, 99-a-b);
  const c=randInt(5, maxC);
  return { prompt:`${a} + ${b} + ${c} =`, type:'number', answer:a+b+c };
}
function genMissingAddend999(){
  const b=randInt(200,999), a=randInt(100, b-50);
  return { prompt:`${a} + ? = ${b}`, type:'number', answer:b-a };
}
function genMulMissingFactor5(){
  const a=randInt(1,5), b=randInt(1,5);
  return { prompt:`${a} × ? = ${a*b}`, type:'number', answer:b };
}
function genDoubleTriple(){
  const n=randInt(1,20); const factor=randInt(2,3);
  return { prompt:`O ${factor===2?'dobro':'triplo'} de ${n} é?`, type:'number', answer:n*factor };
}
function genMulMissingFactor10(){
  const a=randInt(6,10), b=randInt(1,10);
  return { prompt:`${a} × ? = ${a*b}`, type:'number', answer:b };
}
function genSquare(){
  const n=randInt(1,12);
  return { prompt:`${n}² =`, type:'number', answer:n*n };
}
function genDivWord(){
  const b=randInt(2,10), k=randInt(2,10), a=b*k;
  return { prompt:`Se ${a} for dividido em ${b} partes iguais,\nquanto fica cada parte?`, type:'number', answer:k };
}
function genFracCompareMenor(){
  const d=randInt(3,10); let n1=randInt(1,d-1), n2=randInt(1,d-1);
  while(n2===n1) n2=randInt(1,d-1);
  const smaller = n1<n2 ? `${n1}/${d}` : `${n2}/${d}`;
  return { prompt:`Qual fração é menor: ${n1}/${d} ou ${n2}/${d}?`, type:'text', answer:smaller };
}
function genFracSubSameDen(){
  const d=randInt(4,12); const n1=randInt(2,d-1); const n2=randInt(1,n1-1);
  const [sn,sd]=simplifyFraction(n1-n2, d);
  const answer = sd===1 ? `${sn}` : `${sn}/${sd}`;
  return { prompt:`${n1}/${d} − ${n2}/${d} = ?  (forma simplificada)`, type:'text', answer };
}
function genFracDiffDenSub(){
  let d1=randInt(2,6), d2=randInt(2,6);
  while(d2===d1) d2=randInt(2,6);
  let n1=randInt(1,d1-1), n2=randInt(1,d2-1);
  const L=lcm(d1,d2);
  let v1=n1*(L/d1), v2=n2*(L/d2);
  if(v1<v2){ [n1,n2]=[n2,n1]; [d1,d2]=[d2,d1]; [v1,v2]=[v2,v1]; }
  const [sn,sd]=simplifyFraction(v1-v2, L);
  const answer = sd===1 ? `${sn}` : `${sn}/${sd}`;
  return { prompt:`${n1}/${d1} − ${n2}/${d2} = ?  (forma simplificada)`, type:'text', answer };
}
function genDecimalMul(){
  const a=randInt(10,99)/10, n=randInt(2,5);
  const ans = +(a*n).toFixed(1);
  return { prompt:`${a.toFixed(1)} × ${n} =`, type:'number', answer:ans, tolerance:0.05 };
}
function genPercentOf(){
  const options=[{p:10,mult:10},{p:20,mult:5},{p:25,mult:4},{p:50,mult:2},{p:75,mult:4}];
  const o=options[randInt(0,options.length-1)];
  const whole=o.mult*randInt(1,20);
  const part=whole*o.p/100;
  return { prompt:`${part} é quantos por cento de ${whole}?\n(apenas o número, sem %)`, type:'number', answer:o.p };
}
function genConversionToFraction(){
  const pool=[[1,2],[1,4],[3,4],[1,5],[2,5],[3,5],[4,5],[1,10],[3,10],[7,10],[9,10]];
  const [n,d]=pool[randInt(0,pool.length-1)];
  const dec=n/d;
  return { prompt:`Escreva ${formatDecimalClean(dec)} em fração simplificada:`, type:'text', answer:`${n}/${d}` };
}
function genAlg1b(){
  const a=randInt(1,20), x=randInt(-10,20), b=x-a;
  return { prompt:`x − ${a} = ${b}\n\nx = ?`, type:'number', answer:x };
}
function genAlg2b(){
  const a=randInt(2,9); let b=randInt(-10,10); if(b===0) b=1; const x=a*b;
  return { prompt:`x ÷ ${a} = ${b}\n\nx = ?`, type:'number', answer:x };
}
function genAlg3b(){
  const a=randInt(2,9), x=randInt(-10,10), b=randInt(-10,10);
  const c=a*(x+b);
  const bTerm = b>=0 ? `+ ${b}` : `− ${Math.abs(b)}`;
  return { prompt:`${a}(x ${bTerm}) = ${c}\n\nx = ?`, type:'number', answer:x };
}
function genEvalFunctionQuadratic(){
  let a=randInt(-4,4); if(a===0) a=1;
  const b=randInt(-10,10), x=randInt(-5,5);
  const term = b>=0 ? `+ ${b}` : `− ${Math.abs(b)}`;
  return { prompt:`f(x) = ${a}x² ${term}\n\nQuanto é f(${x})?`, type:'number', answer:a*x*x+b };
}
function genFindIntercept(){
  let m=randInt(-5,5); if(m===0) m=1;
  const b=randInt(-10,10);
  const x=randInt(-5,5);
  const y=m*x+b;
  return { prompt:`Uma reta com inclinação ${m} passa pelo\nponto (${x}, ${y}). Qual é o coeficiente linear (b)?`, type:'number', answer:b };
}
function genDerivativeSum(){
  let c1=randInt(2,7); let n1=randInt(2,4);
  let c2=randInt(2,7); let n2=randInt(2,4);
  while(n2===n1) n2=randInt(2,4);
  if(n1<n2){ [n1,n2]=[n2,n1]; [c1,c2]=[c2,c1]; }
  const d1c=c1*n1, d1e=n1-1;
  const d2c=c2*n2, d2e=n2-1;
  function term(coef,exp){ if(exp===0) return `${coef}`; if(exp===1) return `${coef}x`; return `${coef}x^${exp}`; }
  const correctStr = `${term(d1c,d1e)} + ${term(d2c,d2e)}`;
  let opts = [
    `${term(c1,n1)} + ${term(c2,n2)}`,
    `${term(c1*n1,n1)} + ${term(c2*n2,n2)}`,
  ].filter(o=>o!==correctStr);
  let guard=0;
  while(opts.length<3 && guard<10){
    guard++;
    const cand = `${term(d1c+opts.length+1, d1e)} + ${term(d2c, d2e)}`;
    if(cand!==correctStr && !opts.includes(cand)) opts.push(cand);
  }
  opts = opts.slice(0,3);
  const allOpts = shuffle([...opts, correctStr]);
  const correctIndex = allOpts.indexOf(correctStr);
  return { prompt:`Qual é a derivada de ${term(c1,n1)} + ${term(c2,n2)}?`, type:'mc', options:allOpts, answer:correctIndex };
}

/* ---- folhas extras — mais degraus de dificuldade por estágio ---- */
function genCompareRange(min,max){
  let n1=randInt(min,max), n2=randInt(min,max);
  while(n2===n1) n2=randInt(min,max);
  return { prompt:`Qual é maior: ${n1} ou ${n2}?`, type:'number', answer: Math.max(n1,n2) };
}
function genNeighborRange(min,max){
  const n=randInt(min+1,max-1);
  if(Math.random()<0.5) return { prompt:`Qual número vem depois de ${n}?`, type:'number', answer:n+1 };
  return { prompt:`Qual número vem antes de ${n}?`, type:'number', answer:n-1 };
}
function genCountUpTo(maxN){
  const n=randInt(1,maxN);

  let opts = [
    `${a}x^${newExp} + C`,
    `${coeff2}x^${n} + C`,
  ].filter(o=>o!==correctStr);
  let guard=0;
  while(opts.length<3 && guard<10){
    guard++;
    const cand = `${coeff2+opts.length+1}x^${newExp} + C`;
    if(cand!==correctStr && !opts.includes(cand)) opts.push(cand);

  opts = opts.slice(0,3);
  const allOpts = shuffle([...opts, correctStr]);
  const correctIndex = allOpts.indexOf(correctStr);
  return { prompt:`Qual é a integral de ${a}x^${n}?`, type:'mc', options:allOpts, answer:correctIndex };
}

/* ============ Motor de escalonamento — 200 folhas ============ */
// Em vez de escrever 200 funções à mão, cada estágio tem "famílias" de
// exercícios que recebem um parâmetro de dificuldade R, crescente e suave
// ao longo das folhas do estágio (crescimento geométrico, do fácil ao avançado).
function scaleLevel(i, N, start, end){
  const t = (N<=1) ? 0 : (i-1)/(N-1);
  return Math.max(1, Math.round(start * Math.pow(end/start, t)));
}
function buildLevels(stageId, count, rStart, rEnd, familyFactories, nameFn){
  const levels = [];
  for(let i=1;i<=count;i++){
    const R = scaleLevel(i, count, rStart, rEnd);
    const gens = familyFactories.map(f=>{
      const g = f(R); if(!g) return null;
      const w = ()=>{ const q = g(); q.fam = f.name; return q; };
      w.fam = f.name; return w;
    }).filter(Boolean);
    levels.push({ id:`${stageId}-${i}`, name:nameFn(i,R), gens });
  }
  return levels;
}

}
function famInterceptScaled(R){

}
function famDerivativeMonoScaled(R){
  const nMax=Math.min(2+Math.round(R/6), 8);
  return ()=>{
    const coeff=randInt(2,9); const n=randInt(2,Math.max(2,nMax));
    const newCoeff=coeff*n, newExp=n-1;
    const correctStr=`${newCoeff}x^${newExp}`;
    const distractorSet=new Set([`${coeff}x^${n}`, `${coeff}x^${newExp}`, `${newCoeff+randInt(1,3)}x^${newExp}`]);
    distractorSet.delete(correctStr);
    let opts=Array.from(distractorSet).slice(0,3);
    while(opts.length<3) opts.push(`${newCoeff+opts.length+1}x^${newExp}`);
    const allOpts=shuffle([...opts, correctStr]);
    return { prompt:`Qual é a derivada de ${coeff}x^${n}?`, type:'mc', options:allOpts, answer:allOpts.indexOf(correctStr) };
  };
}
function famDerivativeSumScaled(R){
  const nMax=Math.min(2+Math.round(R/6), 6);
  return ()=>{
    let c1=randInt(2,7); let n1=randInt(2,Math.max(2,nMax));
    let c2=randInt(2,7); let n2=randInt(2,Math.max(2,nMax));
    while(n2===n1) n2=randInt(2,Math.max(2,nMax));
    if(n1<n2){ [n1,n2]=[n2,n1]; [c1,c2]=[c2,c1]; }
    const d1c=c1*n1, d1e=n1-1, d2c=c2*n2, d2e=n2-1;
    function term(coef,exp){ if(exp===0) return `${coef}`; if(exp===1) return `${coef}x`; return `${coef}x^${exp}`; }
    const correctStr=`${term(d1c,d1e)} + ${term(d2c,d2e)}`;
    let opts=[`${term(c1,n1)} + ${term(c2,n2)}`, `${term(c1*n1,n1)} + ${term(c2*n2,n2)}`].filter(o=>o!==correctStr);
    let guard=0;
    while(opts.length<3 && guard<10){ guard++; const cand=`${term(d1c+opts.length+1,d1e)} + ${term(d2c,d2e)}`; if(cand!==correctStr && !opts.includes(cand)) opts.push(cand); }
    opts=opts.slice(0,3);
    const allOpts=shuffle([...opts, correctStr]);
    return { prompt:`Qual é a derivada de ${term(c1,n1)} + ${term(c2,n2)}?`, type:'mc', options:allOpts, answer:allOpts.indexOf(correctStr) };
  };
}
function famIntegralScaled(R){
  const nMax=Math.min(1+Math.round(R/6), 6);
  return ()=>{
    const n=randInt(1,Math.max(1,nMax)); const newExp=n+1; const coeff2=randInt(1,6); const a=coeff2*newExp;
    const correctStr=`${coeff2}x^${newExp} + C`;
    let opts=[`${a}x^${newExp} + C`, `${coeff2}x^${n} + C`].filter(o=>o!==correctStr);
    let guard=0;
    while(opts.length<3 && guard<10){ guard++; const cand=`${coeff2+opts.length+1}x^${newExp} + C`; if(cand!==correctStr && !opts.includes(cand)) opts.push(cand); }
    opts=opts.slice(0,3);
    const allOpts=shuffle([...opts, correctStr]);
    return { prompt:`Qual é a integral de ${a}x^${n}?`, type:'mc', options:allOpts, answer:allOpts.indexOf(correctStr) };
  };
}

/* ---- Estágio 1 — Álgebra Avançada ---- */
function famQuadraticRoots(R){
  const hi=Math.max(3,Math.round(R));
  return ()=>{
    let r1=randInt(-hi,hi), r2=randInt(-hi,hi);
    while(r2===r1) r2=randInt(-hi,hi);
    const b=-(r1+r2), c=r1*r2;
    const bTerm=b>=0?`+ ${b}x`:`− ${Math.abs(b)}x`;
    const cTerm=c>=0?`+ ${c}`:`− ${Math.abs(c)}`;
    const eq=`x² ${bTerm} ${cTerm} = 0`;
    const small=Math.min(r1,r2), big=Math.max(r1,r2);
    const qType=randInt(0,3);
    if(qType===0) return { prompt:`${eq}\n\nQual é a menor raiz?`, type:'number', answer:small };
    if(qType===1) return { prompt:`${eq}\n\nQual é a maior raiz?`, type:'number', answer:big };
    if(qType===2) return { prompt:`${eq}\n\nQual é a soma das raízes?`, type:'number', answer:r1+r2 };
    return { prompt:`${eq}\n\nQual é o produto das raízes?`, type:'number', answer:r1*r2 };
  };
}
function famDiscriminant(R){
  const hi=Math.max(2,Math.min(Math.round(R),15));
  return ()=>{
    const a=randInt(1,hi), b=randInt(-hi,hi), c=randInt(-hi,hi);
    const bTerm=b>=0?`+ ${b}x`:`− ${Math.abs(b)}x`;
    const cTerm=c>=0?`+ ${c}`:`− ${Math.abs(c)}`;
    return { prompt:`${a}x² ${bTerm} ${cTerm} = 0\n\nQual é o discriminante (Δ)?`, type:'number', answer:b*b-4*a*c };
  };
}
function famLinearSystem(R){
  const hi=Math.max(3,Math.round(R));
  const coefHi=Math.max(2,Math.min(hi,9));
  return ()=>{
    const x=randInt(-hi,hi), y=randInt(-hi,hi);
    const a1=randInt(1,coefHi), b1=randInt(1,coefHi);
    let a2=randInt(1,coefHi), b2=randInt(1,coefHi);
    let guard=0;
    while(a1*b2-a2*b1===0 && guard<15){ a2=randInt(1,coefHi); b2=randInt(1,coefHi); guard++; }
    const c1=a1*x+b1*y, c2=a2*x+b2*y;
    const prompt=`${a1}x + ${b1}y = ${c1}\n${a2}x + ${b2}y = ${c2}`;
    const ask=randInt(0,2);
    if(ask===0) return { prompt:`${prompt}\n\nQual é o valor de x?`, type:'number', answer:x };
    if(ask===1) return { prompt:`${prompt}\n\nQual é o valor de y?`, type:'number', answer:y };
    return { prompt:`${prompt}\n\nQual é o valor de x + y?`, type:'number', answer:x+y };
  };
}
function famPolyEval(R){
  const hi=Math.max(2,Math.min(Math.round(R),9));
  const xHi=Math.max(2,Math.min(Math.round(R/2),6));
  return ()=>{
    let a=randInt(-hi,hi); if(a===0) a=1;
    const b=randInt(-hi,hi), c=randInt(-hi,hi), d=randInt(-hi,hi);
    const x=randInt(-xHi,xHi);
    const val=a*x*x*x+b*x*x+c*x+d;
    const bT=b>=0?`+ ${b}x²`:`− ${Math.abs(b)}x²`;

  };
}

const TRIG_ANGLES_BASE=[0,30,45,60,90];

function famDefiniteIntegral(R){
  const nMax=Math.max(1,Math.min(1+Math.round(R/50),4));
  const boundHi=Math.max(1,Math.min(1+Math.round(R/60),5));
  return ()=>{
    const n=randInt(1,nMax);
    let p=randInt(0,boundHi), q=randInt(0,boundHi);
    let guard=0;
    while(q===p && guard<10){ q=randInt(0,boundHi); guard++; }
    if(p>q){ const tmp=p; p=q; q=tmp; }
    const val=(Math.pow(q,n+1)-Math.pow(p,n+1))/(n+1);
    return { prompt:`∫ de ${p} a ${q} de x^${n} dx =\n(arredonde para 2 casas decimais)`, type:'number', answer:+val.toFixed(2), tolerance:0.05 };
  };
}

function famComplexOps(R){

  };
}
function famMatrixDet(R){
  const hi=Math.max(2,Math.min(2+Math.round(R/40),15));

  };
}

/* ---- utilitários ---- */
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function fmtBR(x, maxDec){
  if(maxDec===undefined) maxDec = 2;
  let s = (+x).toFixed(maxDec);
  if(maxDec>0) s = s.replace(/0+$/,'').replace(/\.$/,'');
  if(s==='-0') s = '0';
  return s.replace('-', '−').replace('.', ',');
}
function parseBR(v){
  if(v===null || v===undefined) return NaN;
  const t = String(v).trim().replace(/\s/g,'').replace('−','-').replace(',', '.');
  if(t==='') return NaN;
  return Number(t);
}
function signed(n){ return n>0 ? '+'+fmtBR(n) : fmtBR(n); }
function near(a, b, tol){ return Math.abs(a-b) <= (tol===undefined ? 1e-9 : tol); }
function pick(arr){ return arr[randInt(0, arr.length-1)]; }

function withFocusRestore(fn){
  const active = document.activeElement;
  const id = active && active.id;
  fn();
  if(id){
    const el = document.getElementById(id);
    if(el && el !== document.activeElement && !el.disabled) el.focus({preventScroll:true});
  }
}

/* ================= 1. Material dourado ================= */
function svgDourado(s){
  const cell=7, P=cell*10, W=380;
  let y=4, g='';
  const title = (t)=>{ g += `<text x="4" y="${y+11}" class="svg-lbl">${t}</text>`; y += 18; };
  const empty = ()=>{ g += `<text x="4" y="${y+10}" class="svg-empty">nenhuma peça</text>`; y += 18; };
  const piece = (x, yy, w, h)=>`<rect x="${x}" y="${yy}" width="${w}" height="${h}" fill="${C.gold}" stroke="${C.goldDark}" stroke-width=".8"/>`;

  title(`Placas — cada uma vale 100 (${s.c})`);
  if(s.c===0) empty();
  for(let i=0;i<s.c;i++){
    const x = 4 + (i%5)*(P+8), yy = y + Math.floor(i/5)*(P+8);
    g += piece(x, yy, P, P);
    let d=''; for(let k=1;k<10;k++) d += `M${x+k*cell} ${yy}V${yy+P}M${x} ${yy+k*cell}H${x+P}`;
    g += `<path d="${d}" stroke="${C.goldDark}" stroke-opacity=".55" stroke-width=".6"/>`;
  }
  if(s.c>0) y += Math.ceil(s.c/5)*(P+8);
  y += 6;

  title(`Barras — cada uma vale 10 (${s.d})`);
  if(s.d===0) empty();
  for(let i=0;i<s.d;i++){
    const x = 4 + i*(cell+6);
    g += piece(x, y, cell, P);
    let d=''; for(let k=1;k<10;k++) d += `M${x} ${y+k*cell}H${x+cell}`;
    g += `<path d="${d}" stroke="${C.goldDark}" stroke-opacity=".55" stroke-width=".6"/>`;
  }
  if(s.d>0) y += P+8;
  y += 6;

  title(`Cubinhos — cada um vale 1 (${s.u})`);
  if(s.u===0) empty();
  for(let i=0;i<s.u;i++){
    const x = 4 + (i%10)*(cell+5), yy = y + Math.floor(i/10)*(cell+5);
    g += piece(x, yy, cell, cell);
  }
  if(s.u>0) y += Math.ceil(s.u/10)*(cell+5);
  return svgWrap(W, y+6, g, `${s.c} placas, ${s.d} barras e ${s.u} cubinhos`);
}

/* ================= 2. Reta numérica ================= */
function svgNumberLine(s, ch){
  const W=360, x0=18, x1=W-18, yLine=118, H=170;
  const X = v => x0 + (x1-x0)*v/ch.max;
  let g = `<line x1="${x0}" y1="${yLine}" x2="${x1}" y2="${yLine}" stroke="${C.ink}" stroke-width="1.5"/>`;
  for(let v=0; v<=ch.max; v++){
    const major = ch.max<=20 || v%10===0;
    const mid = ch.max>20 && v%5===0;
    const len = major ? 7 : (mid ? 5 : 2.5);
    g += `<line x1="${X(v)}" y1="${yLine-len}" x2="${X(v)}" y2="${yLine+len}" stroke="${C.soft}" stroke-width="${major?1.1:0.6}"/>`;
    if(major) g += `<text x="${X(v)}" y="${yLine+20}" text-anchor="middle" class="svg-num">${v}</text>`;
  }
  let labels = '';
  s.jumps.forEach((j, idx)=>{
    const d = j.to - j.from;
    // pulos seguidos sobre o mesmo trecho ganham alturas diferentes para os rótulos não se sobreporem
    const h = 14 + Math.min(Math.abs(d)*(ch.max<=20?4:0.9), 60) + (idx%3)*15;
    const xa = X(j.from), xb = X(j.to), xm = (xa+xb)/2;
    const col = d>0 ? C.green : C.red;
    g += `<path d="M${xa} ${yLine} Q${xm} ${yLine-2*h} ${xb} ${yLine}" fill="none" stroke="${col}" stroke-width="2"/>`;
    g += `<circle cx="${xb}" cy="${yLine}" r="2.5" fill="${col}"/>`;
    if(ch.max<=20 || Math.abs(d)>=5) labels += `<text x="${xm}" y="${yLine-h-4}" text-anchor="middle" class="svg-tag" fill="${col}" stroke="#FFFDF8" stroke-width="4" paint-order="stroke">${signed(d)}</text>`;
  });
  g += labels; // rótulos por cima de todos os arcos
  g += `<circle cx="${X(ch.a)}" cy="${yLine}" r="5" fill="${C.white}" stroke="${C.slate}" stroke-width="2"/>`;
  g += `<text x="${X(ch.a)}" y="${yLine+36}" text-anchor="middle" class="svg-lbl">início</text>`;
  g += `<circle cx="${X(s.pos)}" cy="${yLine}" r="7" fill="${C.gold}" stroke="${C.goldDark}" stroke-width="1.5"/>`;
  return svgWrap(W, H, g, `Reta numérica de 0 a ${ch.max}. Você está no ${s.pos}.`);
}

};

  view(s, ch){
    const cell=22, ox=28, oy=22, W=ox+12*cell+6, H=oy+12*cell+6;
    let g = `<rect x="${ox}" y="${oy}" width="${12*cell}" height="${12*cell}" fill="none" stroke="${C.line}" stroke-dasharray="2 3"/>`;
    for(let c=0;c<s.cols;c++) g += `<text x="${ox+c*cell+cell/2}" y="${oy-7}" text-anchor="middle" class="svg-num">${c+1}</text>`;
    for(let r=0;r<s.rows;r++) g += `<text x="${ox-7}" y="${oy+r*cell+cell/2+3}" text-anchor="end" class="svg-num">${r+1}</text>`;
    for(let r=0;r<s.rows;r++) for(let c=0;c<s.cols;c++){
      g += `<rect x="${ox+c*cell+1.5}" y="${oy+r*cell+1.5}" width="${cell-3}" height="${cell-3}" rx="2" fill="${C.slate}"/>`;
    }
    let extra = '';
    if(ch.kind==='fatores'){
      const chips = ch.found.length ? ch.found.map(([r,c])=>`<span class="chip">${r} × ${c}</span>`).join('') : '<span class="lab-muted">nenhum ainda</span>';
      extra = `<div class="lab-found">Encontrados (${ch.found.length} de ${ch.pairs.length}): ${chips}</div>`;
    }
    return svgWrap(W, H, g, `${s.rows} fileiras com ${s.cols} quadradinhos cada`) + `<div class="lab-readout">
      <div class="mono">${s.rows} ${s.rows===1?'fileira':'fileiras'} × ${s.cols} ${s.cols===1?'coluna':'colunas'} = <span class="lab-big">${s.rows*s.cols}</span></div>
      ${extra}
    </div>`;
  },
  check(s, ch){
    const p = s.rows*s.cols;
    if(ch.kind==='divisao'){
      if(s.rows!==ch.k) return { ok:false, msg:`Primeiro ajuste para ${ch.k} fileiras.` };
      if(p!==ch.N) return { ok:false, msg:`Com ${s.cols} em cada fileira dá ${p} quadradinhos. Precisa dar ${ch.N}.` };
      return { ok:true, msg:`${ch.N} ÷ ${ch.k} = ${ch.q}, porque ${ch.k} × ${ch.q} = ${ch.N}. Dividir é a multiplicação “ao contrário”.` };
    }
    if(p!==ch.N) return { ok:false, msg:`Esse retângulo tem ${p} quadradinhos, não ${ch.N}.` };
    const r = Math.min(s.rows, s.cols), c = Math.max(s.rows, s.cols);
    if(r<2) return { ok:false, msg:'Use pelo menos 2 fileiras (e pelo menos 2 colunas).' };
    if(ch.found.some(f=>f[0]===r && f[1]===c)) return { ok:false, partial:true, msg:`${r} × ${c} você já encontrou. Girar o retângulo não conta como novo — procure outro formato.` };
    ch.found.push([r,c]);
    ch.found.sort((a,b)=>a[0]-b[0]);
    const left = ch.pairs.length - ch.found.length;
    if(left===0) return { ok:true, msg:`Todos encontrados! ${ch.N} = ${ch.pairs.map(([a,b])=>a+' × '+b).join(' = ')}. Esses números são divisores de ${ch.N}.` };
    return { ok:false, partial:true, msg:`Boa: ${r} × ${c} = ${ch.N}. ${left===1 ? 'Falta 1 retângulo.' : 'Faltam '+left+' retângulos.'}` };
  }
};

/* ================= 4. Barras de fração ================= */
function mkBar(d, n){ return { d, on: Array.from({length:d}, (_,i)=>i<n) }; }
function countOn(b){ return b.on.filter(Boolean).length; }
function fracText(n, d){
  if(d===1) return n ? 'a barra inteira (1)' : 'ainda não foi cortada';
  return `${n}/${d} ≈ ${fmtBR(n/d, 2)}`;
}

const LAB_FRACOES = {
  id:'fracoes', stageId:4, name:'Barras de fração',
  teaser:'Corte, pinte e compare frações',
  idea:'O denominador diz em quantas partes iguais a barra foi cortada; o numerador, quantas estão pintadas.',
  init(){ return { A:mkBar(1,0), B:null }; },
  challenge(lvl, s){
    const kind = ['pinte','equivalente','comparar'][lvl%3];
    if(kind==='pinte'){

    if(kind==='equivalente'){
      const k = randInt(2, Math.floor(12/d)), D = d*k;

    }
    const bigger = Math.random()<0.5;
    let D;
    do { D = randInt(2, 10); } while(D===d || (bigger ? (D-1)/D <= n/d : 1/D >= n/d));
    return { kind, n, d, D, bigger, lockA:true,
      text:`A barra de cima mostra ${n}/${d}. Corte a de baixo em ${D} partes e pinte uma fração ${bigger?'maior':'menor'} que ${n}/${d}.` };
  },
  act(s, ch, name, v){
    if(name==='dA' && !ch.lockA){ s.A = mkBar(clamp(s.A.d+v, 1, 12), 0); return true; }
    if(name==='dB' && s.B){ s.B = mkBar(clamp(s.B.d+v, 1, 12), 0); return true; }
    if(name==='tapA' && !ch.lockA){ s.A.on[v] = !s.A.on[v]; return false; }
    if(name==='tapB' && s.B){ s.B.on[v] = !s.B.on[v]; return false; }
    if(name==='clear'){ if(!ch.lockA) s.A = mkBar(s.A.d, 0); if(s.B) s.B = mkBar(s.B.d, 0); return false; }
    return false;
  },
  controls(s, ch){
    let h = '';
    if(!ch.lockA) h += uiStepper('dA', s.B ? 'Partes da barra de cima' : 'Partes da barra', s.A.d, 1, 12);
    if(s.B) h += uiStepper('dB', 'Partes da barra de baixo', s.B.d, 1, 12);
    h += `<div class="lab-row">${uiBtn('clear', null, 'Apagar pintura', {cls:'ghost'})}</div>`;
    h += `<p class="lab-hint">Toque nas partes da barra para pintar ou apagar.</p>`;
    return h;
  },
  view(s, ch){
    const W=320, x0=20, bw=280, bh=46;
    let g = '', y = 12;
    const bars = [['A', s.A, C.slate, ch.lockA]];
    if(s.B) bars.push(['B', s.B, C.gold, false]);
    bars.forEach(([k, b, col, locked])=>{
      for(let i=0;i<b.d;i++){
        const x = x0 + i*bw/b.d, w = bw/b.d, on = b.on[i];
        const inter = locked ? '' :
          `class="seg" role="button" tabindex="0" aria-label="Parte ${i+1} de ${b.d}, ${on?'pintada':'em branco'}" onclick="labAct('tap${k}',${i})" onkeydown="segKey(event,'tap${k}',${i})"`;
        g += `<rect id="seg-${k}-${i}" x="${x}" y="${y}" width="${w}" height="${bh}" fill="${on?col:C.white}" stroke="${C.ink}" stroke-width="1.2" ${inter}/>`;
      }
      const label = s.B ? (k==='A' ? 'Cima: ' : 'Baixo: ') : '';
      g += `<text x="${x0}" y="${y+bh+18}" class="svg-lbl">${label}${fracText(countOn(b), b.d)}</text>`;
      y += bh + 38;
    });
    if(s.B){
      const xx = x0 + bw*countOn(s.A)/s.A.d;
      g += `<line x1="${xx}" y1="4" x2="${xx}" y2="${y-30}" stroke="${C.red}" stroke-width="2" stroke-dasharray="5 4" pointer-events="none"/>`;
    }
    return svgWrap(W, y-14, g, 'Barras de fração');
  },
  check(s, ch){
    if(ch.kind==='pinte'){
      const na = countOn(s.A);
      if(s.A.d===1) return { ok:false, msg:'Primeiro corte a barra em partes iguais (use o + em “Partes da barra”).' };
      if(na*ch.d === ch.n*s.A.d){
        if(s.A.d===ch.d) return { ok:true, msg:`Isso: ${ch.n} de ${ch.d} partes iguais = ${ch.n}/${ch.d}.` };
        return { ok:true, msg:`${na}/${s.A.d} é equivalente a ${ch.n}/${ch.d}: a mesma quantidade de barra pintada, cortada de outro jeito!` };
      }
      if(s.A.d%ch.d!==0) return { ok:false, msg:`Você pintou ${na}/${s.A.d}. Tente cortar a barra em ${ch.d} partes.` };
      return { ok:false, msg:`Você pintou ${na}/${s.A.d}. Confira quantas partes precisam estar pintadas.` };
    }
    const nb = countOn(s.B);
    if(s.B.d!==ch.D) return { ok:false, msg:`Corte a barra de baixo em ${ch.D} partes.` };
    if(ch.kind==='equivalente'){
      if(nb===ch.n*ch.k) return { ok:true, msg:`${ch.n}/${ch.d} = ${nb}/${ch.D}. Multiplicar em cima e embaixo por ${ch.k} não muda o tamanho da fração.` };
      return { ok:false, msg:'A parte pintada de baixo precisa chegar exatamente na linha vermelha.' };
    }
    if(nb===0 || nb===ch.D) return { ok:false, msg:`Pinte entre 1 e ${ch.D-1} partes.` };
    const okCmp = ch.bigger ? nb*ch.d > ch.n*ch.D : nb*ch.d < ch.n*ch.D;
    if(okCmp) return { ok:true, msg:`${nb}/${ch.D} é ${ch.bigger?'maior':'menor'} que ${ch.n}/${ch.d}: a parte pintada ${ch.bigger?'passa':'não chega'} da linha vermelha.` };
    return { ok:false, msg:`${nb}/${ch.D} não é ${ch.bigger?'maior':'menor'} que ${ch.n}/${ch.d}. Compare com a linha vermelha.` };
  }
};

/* ================= 6. Balança de equações ================= */
function eqLeft(s){
  const parts = [];
  if(s.lx>0) parts.push((s.lx===1 ? '' : s.lx) + 'x');
  if(s.lu>0 || s.lx===0) parts.push(String(s.lu));
  return parts.join(' + ');
}
function svgBalance(s, x){
  const L = s.lx*x + s.lu, R = s.ru;
  const ang = clamp((R-L)*3, -14, 14);
  const W=360, cx=180, cy=72, half=125, drop=118;
  const t = ang*Math.PI/180;
  const ends = [[cx-half*Math.cos(t), cy-half*Math.sin(t)], [cx+half*Math.cos(t), cy+half*Math.sin(t)]];
  let g = `<rect x="${cx-5}" y="${cy}" width="10" height="${268-cy}" fill="${C.soft}"/>
    <rect x="${cx-55}" y="266" width="110" height="9" rx="2" fill="${C.soft}"/>
    <line x1="${ends[0][0]}" y1="${ends[0][1]}" x2="${ends[1][0]}" y2="${ends[1][1]}" stroke="${C.deep}" stroke-width="6" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="7" fill="${C.gold}" stroke="${C.deep}" stroke-width="2"/>`;
  const pan = ([px, py], nx, nu)=>{
    const py2 = py + drop;
    let h = `<line x1="${px}" y1="${py}" x2="${px-56}" y2="${py2}" stroke="${C.soft}"/>
      <line x1="${px}" y1="${py}" x2="${px+56}" y2="${py2}" stroke="${C.soft}"/>
      <rect x="${px-62}" y="${py2}" width="124" height="6" rx="3" fill="${C.deep}"/>`;
    let yy = py2 - 2;
    if(nx>0){
      yy -= 24;
      const w = nx*26 - 4;
      for(let i=0;i<nx;i++){
        const bx = px - w/2 + i*26;
        h += `<rect x="${bx}" y="${yy}" width="22" height="22" rx="2" fill="${C.gold}" stroke="${C.goldDark}"/>
          <text x="${bx+11}" y="${yy+15.5}" text-anchor="middle" class="svg-x">x</text>`;
      }
      yy -= 3;
    }
    for(let i=0;i<nu;i++){
      const row = Math.floor(i/10), col = i%10;
      const inRow = Math.min(10, nu - row*10);
      const rowW = inRow*11 - 2;
      h += `<rect x="${px - rowW/2 + col*11}" y="${yy - 9 - row*11}" width="9" height="9" fill="${C.slate}"/>`;
    }
    return h;
  };
  g += pan(ends[0], s.lx, s.lu) + pan(ends[1], s.rx, s.ru);
  return svgWrap(W, 280, g, `Balança: ${eqLeft(s)} de um lado e ${s.ru} do outro`);
}

const LAB_BALANCA = {
  id:'balanca', stageId:6, name:'Balança de equações',
  teaser:'Resolva equações mantendo a balança equilibrada',
  idea:'Uma equação é uma balança em equilíbrio. O que você tira ou divide de um lado, precisa fazer do outro.',
  init(){ return {lx:1, lu:0, rx:0, ru:0, hist:[], note:''}; },
  challenge(lvl, s){
    let a, x, b;
    if(lvl<2){ a=1; x=randInt(2,9); b=randInt(1,8); }
    else if(lvl<5){ a=randInt(2,3); x=randInt(2,6); b=randInt(0,6); }
    else { a=randInt(2,4); x=randInt(2,8); b=randInt(1,9); }
    const c = a*x + b;
    Object.assign(s, {lx:a, lu:b, rx:0, ru:c, hist:[], note:''});
    return { a, x, b, c, text:`Descubra quanto vale x em ${eqLeft(s)} = ${c}. Cada caixa x tem o mesmo peso; cada cubinho pesa 1.` };
  },
  needsInput(){ return true; },
  act(s, ch, name){
    const snap = () => s.hist.push({lx:s.lx, lu:s.lu, rx:s.rx, ru:s.ru});
    if(name==='both1'){
      if(s.lu<1) s.note = 'Não há cubinhos soltos do lado esquerdo.';
      else if(s.ru<1) s.note = 'Não há cubinhos do lado direito.';
      else { snap(); s.lu--; s.ru--; }
    } else if(name==='bothAll'){
      const k = s.lu;
      if(k<1) s.note = 'Não há cubinhos soltos do lado esquerdo.';
      else if(s.ru<k) s.note = 'O lado direito não tem cubinhos suficientes.';
      else { snap(); s.lu = 0; s.ru -= k; }
    } else if(name==='left1'){
      if(s.lu<1) s.note = 'Não há cubinhos soltos do lado esquerdo.';
      else { snap(); s.lu--; }
    } else if(name==='divide'){
      if(s.lu!==0) s.note = 'Antes de dividir, tire os cubinhos soltos.';
      else if(s.lx<2) s.note = 'Só há uma caixa: não precisa dividir.';
      else if(s.ru % s.lx !== 0) s.note = `${s.ru} cubinhos não se dividem igualmente em ${s.lx} grupos. A balança está equilibrada?`;
      else { snap(); s.ru /= s.lx; s.lx = 1; }
    } else if(name==='undo' && s.hist.length){
      Object.assign(s, s.hist.pop());
    } else if(name==='reset'){
      Object.assign(s, {lx:ch.a, lu:ch.b, rx:0, ru:ch.c, hist:[]});
    }
    return true;
  },
  controls(s){
    return `<div class="lab-row">
      ${uiBtn('both1', null, 'Tirar 1 cubinho de cada lado', {disabled:s.lu<1 || s.ru<1})}
      ${s.lu>1 ? uiBtn('bothAll', null, `Tirar ${s.lu} cubinhos de cada lado`, {disabled:s.ru<s.lu}) : ''}
      ${s.lx>1 ? uiBtn('divide', null, `Dividir os dois lados por ${s.lx}`, {disabled:s.lu>0}) : ''}
    </div>
    <div class="lab-row">
      ${uiBtn('left1', null, 'Tirar 1 só da esquerda', {cls:'warn', disabled:s.lu<1})}
      ${uiBtn('undo', null, 'Desfazer', {cls:'ghost', disabled:!s.hist.length})}
      ${uiBtn('reset', null, 'Recomeçar', {cls:'ghost', disabled:!s.hist.length})}
    </div>`;
  },
  view(s, ch){
    const bal = s.lx*ch.x + s.lu === s.ru;
    return svgBalance(s, ch.x) + `<div class="lab-readout">
      <div class="lab-eq mono">${eqLeft(s)} <span class="${bal?'eq-ok':'eq-bad'}">${bal?'=':'≠'}</span> ${s.ru}</div>
      ${bal ? '' : '<div class="lab-note">A balança desequilibrou: você mexeu só de um lado. Toque em Desfazer.</div>'}
      ${s.note ? `<div class="lab-note">${s.note}</div>` : ''}
    </div>`;
  },
  check(s, ch, input){
    const v = parseBR(input);
    if(v===ch.x){
      const conta = `${ch.a===1 ? '' : ch.a+' × '}${ch.x}${ch.b ? ' + '+ch.b : ''} = ${ch.c}`;
      return { ok:true, msg:`x = ${ch.x}. Confira: ${conta}.` };
    }
    const bal = s.lx*ch.x + s.lu === s.ru;
    if(bal && s.lx===1 && s.lu===0) return { ok:false, msg:`Olhe a balança: uma caixa x sozinha equilibra ${s.ru} cubinhos.` };
    return { ok:false, msg:'Tente deixar uma caixa x sozinha de um lado, mantendo a balança equilibrada.' };
  }
};

/* ================= 7. Geoplano ================= */
function svgRect(s){
  const u=26, ox=24, cols=10, rows=8, oy=12, W=ox+cols*u+14, H=oy+rows*u+30;
  const by = oy + rows*u; // linha de base
  let g = '';
  for(let i=0;i<=cols;i++) for(let j=0;j<=rows;j++) g += `<circle cx="${ox+i*u}" cy="${oy+j*u}" r="1.8" fill="${C.muted}"/>`;
  for(let i=0;i<s.w;i++) for(let j=0;j<s.h;j++){
    g += `<rect x="${ox+i*u+1}" y="${by-(j+1)*u+1}" width="${u-2}" height="${u-2}" fill="${C.slate}" fill-opacity=".22"/>`;
  }
  g += `<rect x="${ox}" y="${by-s.h*u}" width="${s.w*u}" height="${s.h*u}" fill="none" stroke="${C.red}" stroke-width="3" stroke-linejoin="round"/>`;
  g += `<text x="${ox+s.w*u/2}" y="${by+18}" text-anchor="middle" class="svg-tag" fill="${C.red}">base ${s.w}</text>`;
  g += `<text x="${ox-6}" y="${by-s.h*u/2+4}" text-anchor="end" class="svg-tag" fill="${C.red}">${s.h}</text>`;
  return svgWrap(W, H, g, `Retângulo de base ${s.w} e altura ${s.h}`);
}
function svgTri(s, showC){
  const a=s.a, b=s.b;
  const P0=[0,0], P1=[a,0], P2=[0,-b];
  const SA=[[0,0],[a,0],[a,a],[0,a]];
  const SB=[[0,0],[0,-b],[-b,-b],[-b,0]];
  const SC=[[a,0],[0,-b],[b,-b-a],[a+b,-a]];
  const minX=-b, maxX=a+b, minY=-b-a, maxY=a;
  const W=320, H=320, m=16;
  const u = Math.min((W-2*m)/(maxX-minX), (H-2*m)/(maxY-minY));
  const offX = (W - (maxX-minX)*u)/2, offY = (H - (maxY-minY)*u)/2;
  const P = p => [offX + (p[0]-minX)*u, offY + (p[1]-minY)*u];
  const poly = (pts, fill, op) => `<polygon points="${pts.map(p=>P(p).join(',')).join(' ')}" fill="${fill}" fill-opacity="${op}" stroke="${C.ink}" stroke-width="1.2"/>`;
  const gridLines = (O, e1, e2, n1, n2) => {
    let d = '';
    for(let i=1;i<n1;i++){ const A=P([O[0]+e1[0]*i/n1, O[1]+e1[1]*i/n1]), B=P([O[0]+e1[0]*i/n1+e2[0], O[1]+e1[1]*i/n1+e2[1]]); d += `M${A[0]} ${A[1]}L${B[0]} ${B[1]}`; }
    for(let i=1;i<n2;i++){ const A=P([O[0]+e2[0]*i/n2, O[1]+e2[1]*i/n2]), B=P([O[0]+e2[0]*i/n2+e1[0], O[1]+e2[1]*i/n2+e1[1]]); d += `M${A[0]} ${A[1]}L${B[0]} ${B[1]}`; }
    return `<path d="${d}" stroke="${C.ink}" stroke-opacity=".22" stroke-width=".8"/>`;
  };
  const c2 = a*a + b*b, c = Math.sqrt(c2);
  let g = poly(SA, C.slate, .25) + gridLines([0,0],[a,0],[0,a],a,a);
  g += poly(SB, C.gold, .3) + gridLines([0,0],[0,-b],[-b,0],b,b);
  g += poly(SC, C.red, .16);
  if(Number.isInteger(c)) g += gridLines([a,0],[-a,-b],[b,-a],c,c);
  g += poly([P0,P1,P2], C.white, 1);
  const q = P([0,0]), r = 0.35*u;
  g += `<path d="M${q[0]+Math.min(r,10)} ${q[1]}V${q[1]-Math.min(r,10)}H${q[0]}" fill="none" stroke="${C.ink}"/>`;
  const center = pts => P([pts.reduce((t,p)=>t+p[0],0)/pts.length, pts.reduce((t,p)=>t+p[1],0)/pts.length]);
  const lbl = (pts, txt) => { const [x,y] = center(pts); return `<text x="${x}" y="${y+5}" text-anchor="middle" class="svg-area">${txt}</text>`; };
  g += lbl(SA, a*a) + lbl(SB, b*b) + lbl(SC, showC ? c2 : '?');
  return svgWrap(W, H, g, `Triângulo retângulo de catetos ${a} e ${b} com quadrados sobre os lados`);
}

const LAB_GEOPLANO = {
  id:'geoplano', stageId:7, name:'Geoplano',
  teaser:'Construa retângulos e triângulos e meça perímetro e área',
  idea(ch){
    return ch.kind==='pitagoras'
      ? 'Num triângulo retângulo, o quadrado construído sobre a hipotenusa tem a mesma área que os dois quadrados dos catetos juntos.'
      : 'Perímetro é o contorno (a soma dos lados); área é quantos quadradinhos cabem dentro.';
  },
  init(){ return {mode:'ret', w:1, h:1, a:1, b:1}; },
  challenge(lvl, s){
    if(lvl%3===2){
      const [a,b,c] = pick([[3,4,5],[4,3,5],[6,8,10],[8,6,10],[5,12,13],[12,5,13],[9,12,15]]);
      Object.assign(s, {mode:'tri', a:1, b:1});
      return { kind:'pitagoras', a, b, c, text:`Monte um triângulo retângulo com catetos ${a} e ${b}. Quanto mede a hipotenusa? Use as áreas dos quadrados.` };
    }
    Object.assign(s, {mode:'ret', w:1, h:1});
    if(lvl>=3 && lvl%3===1){
      const k = randInt(3,6);
      return { kind:'maxArea', P:4*k, k, text:`Monte um retângulo com perímetro ${4*k} que tenha a maior área possível.` };
    }
    const w = randInt(2,8), h = randInt(2,7);
    return { kind:'areaPer', w, h, A:w*h, P:2*(w+h), text:`Monte um retângulo com área ${w*h} e perímetro ${2*(w+h)}.` };
  },
  needsInput(ch){ return ch.kind==='pitagoras'; },
  act(s, ch, name, v){
    if(name==='w') s.w = clamp(Math.round(v), 1, 10);
    if(name==='h') s.h = clamp(Math.round(v), 1, 8);
    if(name==='a') s.a = clamp(Math.round(v), 1, 12);
    if(name==='b') s.b = clamp(Math.round(v), 1, 12);
    return false;
  },
  controls(s){
    if(s.mode==='tri') return uiSlider('a', 'Cateto horizontal', 1, 12, 1, s.a) + uiSlider('b', 'Cateto vertical', 1, 12, 1, s.b);
    return uiSlider('w', 'Base', 1, 10, 1, s.w) + uiSlider('h', 'Altura', 1, 8, 1, s.h);
  },
  view(s){
    if(s.mode==='tri'){
      const c2 = s.a*s.a + s.b*s.b, root = Math.sqrt(c2);
      const showC = lab.solved;
      return svgTri(s, showC) + `<div class="lab-readout">
        <div class="mono">${s.a}² + ${s.b}² = ${s.a*s.a} + ${s.b*s.b} = ${c2}</div>
        <div>Área do quadrado da hipotenusa: <span class="mono">${c2}</span>${Number.isInteger(root) || showC ? '' : ` — hipotenusa ≈ <span class="mono">${fmtBR(root,2)}</span>`}</div>
      </div>`;
    }
    return svgRect(s) + `<div class="lab-readout">
      <div class="mono">Perímetro = ${s.w} + ${s.h} + ${s.w} + ${s.h} = <span class="lab-big">${2*(s.w+s.h)}</span></div>
      <div class="mono">Área = ${s.w} × ${s.h} = <span class="lab-big">${s.w*s.h}</span> quadradinhos</div>
    </div>`;
  },
  check(s, ch, input){
    if(ch.kind==='pitagoras'){
      const set = (s.a===ch.a && s.b===ch.b) || (s.a===ch.b && s.b===ch.a);
      if(!set) return { ok:false, msg:`Primeiro ajuste os catetos para ${ch.a} e ${ch.b}.` };
      if(parseBR(input)===ch.c) return { ok:true, msg:`${ch.a}² + ${ch.b}² = ${ch.a*ch.a+ch.b*ch.b} = ${ch.c}². A hipotenusa mede ${ch.c}.` };
      return { ok:false, msg:`O quadrado da hipotenusa tem área ${ch.a*ch.a+ch.b*ch.b}. Que número multiplicado por ele mesmo dá isso?` };
    }
    const per = 2*(s.w+s.h), area = s.w*s.h;
    if(ch.kind==='maxArea'){
      if(per!==ch.P) return { ok:false, msg:`O perímetro agora é ${per}; precisa ser ${ch.P}.` };
      if(s.w!==s.h) return { ok:false, partial:true, msg:`Perímetro certo, com área ${area}. Dá para cercar mais área com o mesmo contorno — continue tentando.` };
      return { ok:true, msg:`O quadrado ${ch.k} × ${ch.k} tem área ${ch.k*ch.k}. Entre os retângulos com o mesmo perímetro, o quadrado é o que cerca mais área.` };
    }
    if((s.w===ch.w && s.h===ch.h) || (s.w===ch.h && s.h===ch.w)) return { ok:true, msg:`Base ${s.w} e altura ${s.h}: área ${area} e perímetro ${per}.` };
    return { ok:false, msg:`Agora a área é ${area} e o perímetro é ${per}. Precisa de área ${ch.A} e perímetro ${ch.P}.` };
  }
};

/* ================= 8. Laboratório de gráficos ================= */
function makePlot(win){
  const W=320, H=270, ml=30, mr=10, mt=10, mb=24;
  const sx = x => ml + (x-win.x0)/(win.x1-win.x0)*(W-ml-mr);
  const sy = y => mt + (win.y1-y)/(win.y1-win.y0)*(H-mt-mb);
  let g = `<defs><clipPath id="plotclip"><rect x="${ml}" y="${mt}" width="${W-ml-mr}" height="${H-mt-mb}"/></clipPath></defs>`;
  for(let x=Math.ceil(win.x0/win.gx)*win.gx; x<=win.x1+1e-9; x+=win.gx){
    const axis = Math.abs(x)<1e-9;
    g += `<line x1="${sx(x)}" y1="${mt}" x2="${sx(x)}" y2="${H-mb}" stroke="${axis?C.soft:C.line}" stroke-width="${axis?1.6:0.6}"/>`;
    if(Math.abs(x)>1e-9 && Math.abs(Math.round(x/win.lx)*win.lx - x)<1e-9) g += `<text x="${sx(x)}" y="${H-mb+14}" text-anchor="middle" class="svg-num">${fmtBR(x)}</text>`;
  }
  for(let y=Math.ceil(win.y0/win.gy)*win.gy; y<=win.y1+1e-9; y+=win.gy){
    g += `<line x1="${ml}" y1="${sy(y)}" x2="${W-mr}" y2="${sy(y)}" stroke="${Math.abs(y)<1e-9?C.soft:C.line}" stroke-width="${Math.abs(y)<1e-9?1.6:0.6}"/>`;
    if(Math.abs(y)>1e-9 && Math.abs(Math.round(y/win.ly)*win.ly - y)<1e-9) g += `<text x="${ml-5}" y="${sy(y)+3}" text-anchor="end" class="svg-num">${fmtBR(y)}</text>`;
  }
  const curve = (f, col, w) => {
    let d = '';
    for(let i=0;i<=160;i++){ const x = win.x0 + (win.x1-win.x0)*i/160; d += (i?'L':'M') + sx(x).toFixed(1) + ' ' + sy(f(x)).toFixed(1); }
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w||2.5}" clip-path="url(#plotclip)"/>`;
  };
  return { W, H, sx, sy, frame:g, curve };
}

const AREA_CASES = [
  { f:x=>x,     label:'x',  B:4, exact:8,   exactTxt:'8',          win:{x0:-0.5,x1:4.5,y0:-0.5,y1:5,gx:1,gy:1,lx:1,ly:1} },
  { f:x=>x*x,   label:'x²', B:3, exact:9,   exactTxt:'9',          win:{x0:-0.5,x1:3.5,y0:-0.8,y1:10,gx:1,gy:1,lx:1,ly:2} },
  { f:x=>x*x,   label:'x²', B:2, exact:8/3, exactTxt:'8/3 ≈ 2,67', win:{x0:-0.3,x1:2.4,y0:-0.4,y1:5,gx:0.5,gy:1,lx:1,ly:1} },
];
function riemann(f, B, n){
  const dx = B/n; let lo = 0, hi = 0;
  for(let i=0;i<n;i++){ lo += f(i*dx)*dx; hi += f((i+1)*dx)*dx; }
  return {lo, hi, dx};
}

const LAB_GRAFICOS = {
  id:'graficos', stageId:8, name:'Laboratório de gráficos',
  teaser:'Mexa em retas, tangentes e áreas sob curvas',
  idea(ch){
    if(ch.kind==='reta') return 'Em y = ax + b, o a é a inclinação (quanto a reta sobe a cada passo para a direita) e o b é onde ela corta o eixo y.';
    if(ch.kind==='tangente') return 'A secante liga dois pontos da curva. Quando h fica bem pequeno, ela vira a tangente — e a inclinação da tangente é a derivada.';
    return 'Retângulos por baixo e por cima da curva prendem a área entre duas somas. Quanto mais retângulos, mais apertado o cerco.';
  },
  init(){ return {a:0, b:0, x0:0, h:2, n:2}; },
  challenge(lvl, s){
    const kind = ['reta','tangente','area'][lvl%3];
    if(kind==='reta'){
      const slopes = lvl<3 ? [-3,-2,-1,1,2,3] : [-2.5,-2,-1.5,-1,-0.5,0.5,1,1.5,2,2.5];
      let m, b, x1, x2, y1, y2;
      do {
        m = pick(slopes); b = randInt(-4,4); x1 = randInt(-5,1); x2 = x1 + randInt(2,4);
        y1 = m*x1 + b; y2 = m*x2 + b;
      } while(Math.abs(y1)>9 || Math.abs(y2)>9);
      Object.assign(s, {a:0, b:0});
      return { kind, m, b, pts:[[x1,y1],[x2,y2]], text:`Ajuste a e b para a reta passar pelos dois pontos marcados: (${fmtBR(x1)}; ${fmtBR(y1)}) e (${fmtBR(x2)}; ${fmtBR(y2)}).` };
    }
    if(kind==='tangente'){
      const x0 = randInt(1,3);
      Object.assign(s, {x0:0, h:2});
      return { kind, x0, text:`Qual é a inclinação da reta tangente a y = x² no ponto x = ${x0}? Coloque o ponto em x = ${x0} e vá diminuindo h.` };
    }
    const cs = AREA_CASES[lvl<6 ? (lvl<3 ? 0 : 1) : randInt(0, AREA_CASES.length-1)];
    s.n = 2;
    return { kind, cs, text:`Estime a área sob y = ${cs.label} entre x = 0 e x = ${cs.B}. Aumente o número de retângulos até as duas somas ficarem bem próximas.` };
  },
  needsInput(ch){ return ch.kind!=='reta'; },
  act(s, ch, name, v){
    if(name in s) s[name] = v;
    return false;
  },
  controls(s, ch){
    if(ch.kind==='reta') return uiSlider('a', 'a (inclinação)', -4, 4, 0.5, s.a) + uiSlider('b', 'b (corte no eixo y)', -8, 8, 1, s.b);
    if(ch.kind==='tangente') return uiSlider('x0', 'Ponto x₀', 0, 4, 0.5, s.x0) + uiSlider('h', 'Distância h até o segundo ponto', 0.05, 3, 0.05, s.h);
    return uiSlider('n', 'Número de retângulos', 1, 50, 1, s.n);
  },
  view(s, ch){
    if(ch.kind==='reta'){
      const P = makePlot({x0:-6,x1:6,y0:-10,y1:10,gx:1,gy:2,lx:2,ly:4});
      let g = P.frame + P.curve(x => s.a*x + s.b, C.slate);
      ch.pts.forEach(([x,y])=>{
        const hit = near(s.a*x + s.b, y);
        g += `<circle cx="${P.sx(x)}" cy="${P.sy(y)}" r="6" fill="${hit?C.green:C.white}" stroke="${hit?C.green:C.red}" stroke-width="2.5"/>`;
      });
      const bTxt = s.b<0 ? `− ${fmtBR(-s.b)}` : `+ ${fmtBR(s.b)}`;
      return svgWrap(P.W, P.H, g, `Reta y = ${fmtBR(s.a)}x ${bTxt}`) + `<div class="lab-readout">
        <div class="lab-eq mono">y = ${fmtBR(s.a)}x ${bTxt}</div>
        <div>Pontos atingidos: ${ch.pts.filter(([x,y])=>near(s.a*x+s.b, y)).length} de 2</div>
      </div>`;
    }
    if(ch.kind==='tangente'){
      const f = x => x*x;
      const P = makePlot({x0:-1,x1:5,y0:-2,y1:26,gx:1,gy:5,lx:1,ly:5});
      const x0 = s.x0, x1 = s.x0 + s.h, m = (f(x1)-f(x0))/s.h;
      let g = P.frame + P.curve(f, C.slate);
      g += P.curve(x => f(x0) + m*(x-x0), C.red, 1.8);
      g += `<circle cx="${P.sx(x1)}" cy="${P.sy(f(x1))}" r="5" fill="${C.white}" stroke="${C.red}" stroke-width="2"/>`;
      g += `<circle cx="${P.sx(x0)}" cy="${P.sy(f(x0))}" r="6" fill="${C.gold}" stroke="${C.goldDark}" stroke-width="1.5"/>`;
      return svgWrap(P.W, P.H, g, 'Curva y = x² com reta secante') + `<div class="lab-readout">
        <div>Ponto: <span class="mono">(${fmtBR(x0)}; ${fmtBR(f(x0))})</span>, h = <span class="mono">${fmtBR(s.h)}</span></div>
        <div>Inclinação da secante = <span class="mono">(f(x₀+h) − f(x₀)) ÷ h</span> = <span class="lab-big">${fmtBR(m, 2)}</span></div>
      </div>`;
    }
    const cs = ch.cs, P = makePlot(cs.win), r = riemann(cs.f, cs.B, s.n);
    let g = P.frame;
    for(let i=0;i<s.n;i++){
      const xa = i*r.dx, xb = (i+1)*r.dx;
      const hi = cs.f(xb), lo = cs.f(xa);
      g += `<rect x="${P.sx(xa)}" y="${P.sy(hi)}" width="${P.sx(xb)-P.sx(xa)}" height="${P.sy(0)-P.sy(hi)}" fill="${C.gold}" fill-opacity=".18" stroke="${C.gold}" stroke-width=".8"/>`;
      g += `<rect x="${P.sx(xa)}" y="${P.sy(lo)}" width="${P.sx(xb)-P.sx(xa)}" height="${P.sy(0)-P.sy(lo)}" fill="${C.slate}" fill-opacity=".45" stroke="${C.slate}" stroke-width=".6"/>`;
    }
    g += P.curve(cs.f, C.red, 2.5);
    return svgWrap(P.W, P.H, g, `Área sob y = ${cs.label} com ${s.n} retângulos`) + `<div class="lab-readout">
      <div>Soma por baixo (azul): <span class="mono">${fmtBR(r.lo, 3)}</span></div>
      <div>Soma por cima (dourado): <span class="mono">${fmtBR(r.hi, 3)}</span></div>
      <div>A área está entre as duas. Diferença: <span class="mono">${fmtBR(r.hi-r.lo, 3)}</span></div>
    </div>`;
  },
  check(s, ch, input){
    if(ch.kind==='reta'){
      const hits = ch.pts.filter(([x,y])=>near(s.a*x+s.b, y)).length;
      if(hits===2){
        const bTxt = ch.b<0 ? `− ${fmtBR(-ch.b)}` : `+ ${fmtBR(ch.b)}`;
        return { ok:true, msg:`y = ${fmtBR(ch.m)}x ${bTxt}: inclinação ${fmtBR(ch.m)} e corte no eixo y em ${fmtBR(ch.b)}.` };
      }
      if(near(s.a, ch.m)) return { ok:false, msg:'A inclinação já está certa (a reta está paralela à certa). Agora suba ou desça com b.' };
      return { ok:false, msg:`A reta passa por ${hits} dos 2 pontos. Observe: entre os pontos, quanto y muda quando x anda 1?` };
    }
    const v = parseBR(input);
    if(ch.kind==='tangente'){
      if(!near(s.x0, ch.x0)) return { ok:false, msg:`Coloque o ponto em x₀ = ${ch.x0}.` };
      if(near(v, 2*ch.x0, 0.06)) return { ok:true, msg:`Isso: a tangente em x = ${ch.x0} tem inclinação ${2*ch.x0}. A derivada de x² é 2x, e 2 × ${ch.x0} = ${2*ch.x0}.` };
      return { ok:false, msg:'Observe o número da secante quando h fica bem pequeno: para que valor ele se aproxima?' };
    }
    if(near(v, ch.cs.exact, 0.15)) return { ok:true, msg:`A área exata é ${ch.cs.exactTxt}. As duas somas se aproximam desse valor quando o número de retângulos cresce — essa é a ideia da integral.` };
    return { ok:false, msg:'A área fica entre a soma por baixo e a soma por cima. Aumente o número de retângulos e estime de novo.' };
  }
};

const LABS = [LAB_DOURADO, LAB_RETA, LAB_MATRIZ, LAB_FRACOES, LAB_GRADE, LAB_BALANCA, LAB_GEOPLANO, LAB_GRAFICOS];

/* ---- navegação e ciclo do laboratório ---- */
function openLabs(){ screen='labs'; render(); window.scrollTo(0,0); }
function openLab(id, from){
  const def = LABS.find(l=>l.id===id);
  if(!def) return;
  if(def.stageId>7 && !hasFullAccess()){ alert('Este laboratório faz parte do jogo completo (R$ 49,90, pagamento único).'); return; }
  labReturn = from || 'map';
  lab = { def, s:null, ch:null, fb:null, solved:false, inputVal:'' };
  newLabChallenge();
  screen='lab'; render(); window.scrollTo(0,0);
}
function closeLab(){ lab = null; screen = labReturn; render(); window.scrollTo(0,0); }
function newLabChallenge(){
  const lvl = labProgress[lab.def.id] || 0;
  lab.s = lab.def.init(lvl);
  lab.ch = lab.def.challenge(lvl, lab.s);
  lab.fb = null; lab.solved = false; lab.inputVal = '';
}
function labNew(){
  if(lab.def.beforeNew) lab.def.beforeNew(lab.ch, lab.solved);
  newLabChallenge();
  renderLab();
  const el = document.querySelector('.lab-challenge');
  if(el && el.getBoundingClientRect().top < 0) el.scrollIntoView({block:'start'});
}
function labAct(name, val){
  if(!lab) return;
  lab.s.note = '';
  const full = lab.def.act(lab.s, lab.ch, name, val);
  if(!lab.solved) lab.fb = null;
  if(full) renderLab(); else updateLabView();
}
function labSlide(key, v){
  const out = document.getElementById('out-'+key);
  if(out) out.textContent = fmtBR(Number(v));
  labAct(key, Number(v));
}
function labCheck(){
  if(!lab) return;
  const needs = lab.def.needsInput && lab.def.needsInput(lab.ch);
  if(needs && isNaN(parseBR(lab.inputVal))){
    lab.fb = { ok:false, msg:'Escreva sua resposta (um número) antes de verificar.' };
    updateLabView();
    return;
  }
  const r = lab.def.check(lab.s, lab.ch, lab.inputVal);
  lab.fb = r;
  if(r.ok && !lab.solved){
    lab.solved = true;
    if(lab.def.onSolved) lab.def.onSolved(lab.ch);
    else labProgress[lab.def.id] = (labProgress[lab.def.id] || 0) + 1;
    saveLabProgress();
  }
  renderLab();
}
function labFeedbackHtml(){
  const fb = lab && lab.fb;
  if(!fb) return '';
  if(fb.ok) return `<span class="lab-stamp ok" aria-hidden="true">✓</span><span class="ok">${fb.msg}</span>`;
  if(fb.partial) return `<span class="partial">${fb.msg}</span>`;
  return `<span class="wrong"><strong>Ainda não.</strong> ${fb.msg}</span>`;
}
function updateLabView(){

              oninput="lab.inputVal=this.value" onkeydown="if(event.key==='Enter') labCheck()"></label>` : ''}
          <div class="btn-row">

            <button class="btn secondary" id="lab-new" onclick="labNew()">${d.newLabel ? d.newLabel(lab.solved) : (lab.solved ? 'Próximo desafio' : 'Trocar desafio')}</button>

function labCard(l){
