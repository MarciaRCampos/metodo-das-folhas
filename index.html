/* ============ Etnomatemática — matemática de diferentes povos ============ */
// Do básico ao avançado: quipu inca, numeração maia, oware, frisos, sona e tranças nagô.

/* ================= Quipu inca (básico) ================= */
const QUIPU_PLACES = ['milhar','centena','dezena','unidade'];
function digitsOf(v, len){ const d=[]; for(let i=0;i<len;i++){ d.unshift(v%10); v=Math.floor(v/10); } return d; }
function quipuValue(d){ return d.reduce((t,x)=>t*10+x, 0); }
function svgQuipu(cords){
  // cords: [{d:[m,c,d,u], label, color, hidden}]
  const W=330, top=24, bands=[60,112,164,216], bandH=40, xs0=96, gap=Math.min(70, 220/Math.max(1,cords.length-1||1));
  let g = `<line x1="14" y1="${top}" x2="${W-10}" y2="${top}" stroke="${C.goldDark}" stroke-width="5" stroke-linecap="round"/>`;
  QUIPU_PLACES.forEach((p,i)=>{
    g += `<text x="6" y="${bands[i]+bandH/2+4}" class="svg-num">${p}</text>`;
    g += `<line x1="62" y1="${bands[i]+bandH+4}" x2="${W-10}" y2="${bands[i]+bandH+4}" stroke="${C.line}" stroke-dasharray="2 4"/>`;
  });
  cords.forEach((c, k)=>{
    const x = xs0 + k*gap, col = c.color || C.goldDark;
    g += `<path d="M${x} ${top}C${x} ${top+12} ${x} ${top+14} ${x} ${top+30}L${x} 290" stroke="${col}" stroke-width="2.5" fill="none"/>`;
    if(c.label) g += `<text x="${x}" y="306" text-anchor="middle" class="svg-lbl">${c.label}</text>`;
    if(c.hidden) { g += `<text x="${x}" y="160" text-anchor="middle" class="svg-area">?</text>`; return; }
    c.d.forEach((n, pi)=>{
      if(n===0) return;
      const yTop = bands[pi], cy0 = yTop + bandH/2;
      if(pi===3){
        if(n===1){ // nó em forma de oito
          g += `<circle cx="${x}" cy="${cy0-4}" r="4.5" fill="none" stroke="${C.deep}" stroke-width="3"/><circle cx="${x}" cy="${cy0+4}" r="4.5" fill="none" stroke="${C.deep}" stroke-width="3"/>`;
        } else { // nó longo: uma volta por unidade
          const h = 8 + n*4.2;
          g += `<rect x="${x-5}" y="${cy0-h/2}" width="10" height="${h}" rx="5" fill="${C.deep}"/>`;
          for(let t=1;t<n;t++) g += `<line x1="${x-5}" y1="${cy0-h/2+4+t*4.2}" x2="${x+5}" y2="${cy0-h/2+t*4.2}" stroke="${C.paper}" stroke-width="1"/>`;
        }
      } else { // nós simples agrupados
        const step = Math.min(7, (bandH-6)/n);
        for(let t=0;t<n;t++) g += `<circle cx="${x}" cy="${cy0 - (n-1)*step/2 + t*step}" r="3.6" fill="${C.deep}"/>`;
      }
    });
  });
  return svgWrap(W, 314, g, 'Quipu: cordões com nós');
}

const LAB_QUIPU = {
  id:'quipu', group:'etno', stageId:1, level:'Básico', name:'Quipu inca', origin:'Andes, Império Inca',
  teaser:'Leia e escreva números com nós em cordões',
  idea:'A posição do nó no cordão diz se ele vale 1, 10, 100 ou 1000 — exatamente como a posição de um algarismo no nosso número.',
  culture:'Os quipus eram cordões com nós usados no Império Inca, nos Andes, para registrar números: censos, tributos, colheitas. O sistema era decimal e posicional. Nas casas de cima, cada nó simples vale 1 daquela posição; nas unidades, o número aparece num nó longo, com uma volta para cada unidade, e o 1 é um nó em forma de oito. Espaço sem nó é o zero. Muitos quipus têm um cordão extra que guarda a soma dos outros.',
  init(){ return { d:[0,0,0,0] }; },
  challenge(lvl, s){
    s.d = [0,0,0,0];
    const kind = lvl<3 ? ['ler','montar','ler'][lvl] : ['ler','montar','soma'][lvl%3];
    const max = lvl<3 ? 999 : 9999;
    if(kind==='soma'){
      const parts = [randInt(100,2999), randInt(100,2999), randInt(10,999)];
      return { kind, parts, total:parts.reduce((a,b)=>a+b,0), text:'O quipu tem três cordões com números e um cordão de total, vazio. Faça a soma e amarre os nós do total.' };
    }
    const v = randInt(lvl<1 ? 11 : 101, max);
    return { kind, value:v, text: kind==='ler' ? 'Que número está registrado neste cordão?' : `Amarre os nós para registrar o número ${v}.` };
  },
  needsInput(ch){ return ch.kind==='ler'; },
  act(s, ch, name, v){ const i = ['m','c','d','u'].indexOf(name); if(i>=0) s.d[i] = clamp(s.d[i]+v, 0, 9); return true; },
  controls(s, ch){
    if(ch.kind==='ler') return '<p class="lab-hint">Conte os nós de cada faixa. O nó longo (embaixo) tem uma volta para cada unidade.</p>';
    return uiStepper('m','Nós de milhar',s.d[0],0,9) + uiStepper('c','Nós de centena',s.d[1],0,9) + uiStepper('d','Nós de dezena',s.d[2],0,9) + uiStepper('u','Voltas do nó das unidades',s.d[3],0,9);
  },
  view(s, ch){
    if(ch.kind==='ler') return svgQuipu([{d:digitsOf(ch.value,4)}]);
    if(ch.kind==='montar') return svgQuipu([{d:s.d.slice(), label:'seu cordão'}]) + `<div class="lab-readout"><div class="mono">${s.d.join(' ')}</div></div>`;
    const cords = ch.parts.map((p,i)=>({d:digitsOf(p,4), label:'cordão '+(i+1)}));
    cords.push({d:s.d.slice(), label:'total', color:C.red});
    return svgQuipu(cords);
  },
  check(s, ch, input){
    if(ch.kind==='ler'){
      if(parseBR(input)===ch.value) return { ok:true, msg:`${ch.value}: ${digitsOf(ch.value,4).map((n,i)=>n+' '+(['milhar','centena','dezena','unidade'][i])+(n===1?'':(i===0?'es':'s'))).filter(t=>!t.startsWith('0 ')).join(', ')}.` };
      return { ok:false, msg:'Leia de cima para baixo: milhares, centenas, dezenas e, por último, as voltas do nó longo.' };
    }
    const v = quipuValue(s.d);
    const target = ch.kind==='soma' ? ch.total : ch.value;
    if(v===target) return { ok:true, msg: ch.kind==='soma' ? `${ch.parts.join(' + ')} = ${ch.total}. Os contadores incas conferiam as contas assim, comparando os cordões.` : `Isso: ${v} registrado com nós.` };
    return { ok:false, msg:`Seu cordão marca ${v}${ch.kind==='soma' ? '. Confira a soma, posição por posição (lembre do “vai um”).' : '.'}` };
  }
};

/* ================= Numeração maia (básico → intermediário) ================= */
function mayaDigits(v){ const d=[]; do { d.push(v%20); v=Math.floor(v/20); } while(v>0); return d; } // d[0] = unidades
function svgMayaShell(cx, cy){
  return `<ellipse cx="${cx}" cy="${cy}" rx="22" ry="11" fill="${C.white}" stroke="${C.ink}" stroke-width="2"/>
    <path d="M${cx-16} ${cy-2}Q${cx} ${cy-9} ${cx+16} ${cy-2}M${cx-14} ${cy+4}Q${cx} ${cy-2} ${cx+14} ${cy+4}" fill="none" stroke="${C.ink}" stroke-width="1.5"/>`;
}
function svgMaya(levels, showMult){
  // levels[0] = unidades (embaixo)
  const n = levels.length, boxH=78, W=300, cx=130;
  let g = '';
  for(let k=n-1, row=0; k>=0; k--, row++){
    const y0 = 8 + row*(boxH+8), {bars, dots} = levels[k];
    g += `<rect x="40" y="${y0}" width="180" height="${boxH}" rx="4" fill="${C.white}" stroke="${C.line}"/>`;
    if(showMult) g += `<text x="232" y="${y0+boxH/2+4}" class="svg-tag" fill="${C.soft}">× ${Math.pow(20,k)}</text>`;
    if(bars===0 && dots===0){ g += svgMayaShell(cx, y0+boxH/2); continue; }
    const contentH = (dots?16:0) + bars*14;
    let y = y0 + (boxH - contentH)/2;
    if(dots){ for(let i=0;i<dots;i++) g += `<circle cx="${cx-(dots-1)*9+i*18}" cy="${y+6}" r="6" fill="${C.red}"/>`; y += 16; }
    for(let b=0;b<bars;b++){ g += `<rect x="${cx-46}" y="${y+2}" width="92" height="9" rx="4.5" fill="${C.deep}"/>`; y += 14; }
  }
  return svgWrap(W, 8 + n*(boxH+8), g, 'Número maia');
}
function toBarsDots(d){ return {bars:Math.floor(d/5), dots:d%5}; }

const LAB_MAIA = {
  id:'maia', group:'etno', stageId:1, level:'Básico ao intermediário', name:'Numeração maia', origin:'México e América Central, povo maia',
  teaser:'Conte em base 20 com pontos, barras e uma concha para o zero',
  idea:'Ponto vale 1, barra vale 5, a concha é o zero. Cada nível de baixo para cima vale 20 vezes mais que o anterior: 1, 20, 400, 8000…',
  culture:'Os maias, que viveram no sul do México e na América Central, contavam em base 20 usando só três símbolos. Foram um dos primeiros povos do mundo a usar o zero dentro de uma notação posicional. Os números eram escritos de baixo para cima. (Nos cálculos do calendário, o terceiro nível valia 360 em vez de 400; aqui usamos a contagem comum, em base 20.)',
  init(){ return { lv:[{bars:0,dots:0}] }; },
  challenge(lvl, s){
    const kind = lvl%2===0 ? 'ler' : 'escrever';
    const v = lvl<2 ? randInt(1,19) : (lvl<5 ? randInt(20,399) : randInt(400,7999));
    const nLv = mayaDigits(v).length;
    s.lv = Array.from({length:nLv}, ()=>({bars:0,dots:0}));
    return { kind, value:v, nLv, text: kind==='ler' ? 'Que número está escrito aqui?' : `Escreva o número ${v} em numeração maia. Você tem ${nLv} ${nLv===1?'nível':'níveis'}.` };
  },
  needsInput(ch){ return ch.kind==='ler'; },
  act(s, ch, name, v){
    const m = /^(b|p)(\d)$/.exec(name); if(!m) return false;
    const L = s.lv[+m[2]];
    if(m[1]==='b') L.bars = clamp(L.bars+v, 0, 3); else L.dots = clamp(L.dots+v, 0, 4);
    return true;
  },
  controls(s, ch){
    if(ch.kind==='ler') return '<p class="lab-hint">Some cada nível (barras valem 5, pontos valem 1) e multiplique pelo valor da posição.</p>';
    const names = ['Nível de baixo (vale × 1)','Segundo nível (vale × 20)','Terceiro nível (vale × 400)'];
    let h = '';
    for(let k=s.lv.length-1;k>=0;k--){
      h += `<div class="lab-group"><div class="lab-group-title">${names[k]}</div>`
        + uiStepper('b'+k, 'Barras', s.lv[k].bars, 0, 3) + uiStepper('p'+k, 'Pontos', s.lv[k].dots, 0, 4) + '</div>';
    }
    return h;
  },
  view(s, ch){
    const lv = ch.kind==='ler' ? mayaDigits(ch.value).map(toBarsDots) : s.lv;
    const show = lvlOf('maia')<5 || lab.solved;
    let extra = '';
    if(ch.kind==='escrever'){
      const digs = s.lv.map(L=>L.bars*5+L.dots);
      extra = `<div class="lab-readout"><div class="mono">${digs.slice().reverse().map((d,i)=>`${d} × ${Math.pow(20, digs.length-1-i)}`).join(' + ')}${lab.solved ? ' = '+ch.value : ''}</div></div>`;
    }
    return svgMaya(lv, show) + extra;
  },
  check(s, ch, input){
    if(ch.kind==='ler'){
      if(parseBR(input)===ch.value){
        const d = mayaDigits(ch.value);
        return { ok:true, msg:`${d.slice().reverse().map((x,i)=>`${x} × ${Math.pow(20,d.length-1-i)}`).join(' + ')} = ${ch.value}.` };
      }
      return { ok:false, msg:'Some cada nível separadamente e depois multiplique: o nível de baixo vale 1, o de cima 20, o seguinte 400.' };
    }
    const v = s.lv.reduce((t,L,k)=>t + (L.bars*5+L.dots)*Math.pow(20,k), 0);
    if(v===ch.value) return { ok:true, msg:`Isso! Em base 20: ${mayaDigits(ch.value).slice().reverse().join(' | ')}.` };
    return { ok:false, msg:`Seu número vale ${v}. Dica: quantas vintenas cabem em ${ch.value}? O que sobra vai para o nível de baixo.` };
  }
};
function lvlOf(id){ return labProgress[id] || 0; }

/* ================= Oware / mancala (intermediário) ================= */
const OWARE_TOP = 'GHIJKL'; // casas 6..11 (adversário), na ordem de semeadura
function owareName(i){ return i<6 ? 'ABCDEF'[i] : OWARE_TOP[i-6]; }
function owareSow(board, h){
  const b = board.slice(); let n = b[h]; b[h] = 0; let i = h;
  while(n>0){ i = (i+1)%12; if(i===h) continue; b[i]++; n--; }
  let cap = 0; const caps = []; let j = i;
  while(j>=6 && (b[j]===2 || b[j]===3)){ cap += b[j]; caps.push(j); b[j] = 0; j--; }
  return { board:b, last:i, captured:cap, caps };
}
function owareBest(board){ let best=0; for(let h=0;h<6;h++) if(board[h]>0) best = Math.max(best, owareSow(board,h).captured); return best; }
function owareRandom(lvl){
  const big = lvl>=4;
  const b = [];
  for(let i=0;i<6;i++) b.push(randInt(0, big ? 8 : 6));
  if(big && Math.random()<0.6) b[randInt(0,5)] = randInt(12,16);
  for(let i=0;i<6;i++) b.push(pick([0,1,1,1,2,2,3,4,5]));
  if(b.slice(0,6).every(x=>x===0)) b[randInt(0,5)] = randInt(1,5);
  return b;
}
function svgOware(b, opts){
  opts = opts || {};
  const W=340, H=206, r=22, x0=40, dx=52, yTop=72, yBot=134;
  let g = `<rect x="6" y="38" width="${W-12}" height="130" rx="40" fill="#C9A26B" stroke="${C.goldDark}" stroke-width="2"/>`;
  const pos = i => i<6 ? [x0 + i*dx, yBot] : [x0 + (11-i)*dx, yTop];
  for(let i=0;i<12;i++){
    const [x,y] = pos(i), n = b[i];
    const isLast = opts.last===i, isCap = opts.caps && opts.caps.includes(i);
    const tap = opts.tap && i<6 && (opts.src || b)[i]>0; // casas jogáveis seguem o tabuleiro inicial
    g += `<circle cx="${x}" cy="${y}" r="${r}" fill="#8A6236" stroke="${isLast ? C.red : (isCap ? C.green : '#6E4B26')}" stroke-width="${isLast||isCap?4:1.5}"
      ${tap ? `class="seg" role="button" tabindex="0" id="pit-${i}" aria-label="Casa ${owareName(i)}, ${n} sementes" onclick="labAct('sow',${i})" onkeydown="segKey(event,'sow',${i})"` : ''}/>`;
    const shown = Math.min(n, 14);
    for(let k=0;k<shown;k++){
      const a = k*2.4, rr = 3.2*Math.sqrt(k+0.5);
      g += `<circle cx="${x + rr*Math.cos(a)}" cy="${y + rr*Math.sin(a)}" r="3.4" fill="#F4E9D2" stroke="#6E4B26" stroke-width=".6" pointer-events="none"/>`;
    }
    const ly = i<6 ? 184 : 31;
    g += `<text x="${x}" y="${ly}" text-anchor="middle" class="svg-tag" fill="${C.ink}">${owareName(i)}: ${n}</text>`;
  }
  g += `<text x="${W/2}" y="12" text-anchor="middle" class="svg-lbl">adversário</text><text x="${W/2}" y="202" text-anchor="middle" class="svg-lbl">você — as sementes andam no sentido anti-horário</text>`;
  return svgWrap(W, H, g, 'Tabuleiro de oware');
}

const LAB_OWARE = {
  id:'oware', group:'etno', stageId:3, level:'Intermediário', name:'Oware (mancala)', origin:'África Ocidental e Cabo Verde',
  teaser:'Semeie, conte e capture: divisão e estratégia num jogo africano',
  idea:'Você pega todas as sementes de uma casa e semeia uma em cada casa seguinte. Se a última cair do lado do adversário e deixar a casa com 2 ou 3, você captura — e continua capturando para trás enquanto houver casas com 2 ou 3. Com 12 ou mais sementes, você dá a volta e pula a casa de onde saiu.',
  culture:'Mancala é uma família de jogos de semeadura jogados há séculos em todo o continente africano, que também chegou às Américas com a diáspora africana. O oware (também chamado ouri ou awalé) é tradicional na África Ocidental e em Cabo Verde. Jogar bem exige contar, prever onde cai a última semente e pensar à frente. Usamos aqui as regras básicas de captura.',
  init(){ return { move:null }; },
  challenge(lvl, s){
    s.move = null;
    const kind = (lvl<2 || lvl%2===0) ? 'captura' : 'prever';
    let b, best;
    if(kind==='captura'){
      do { b = owareRandom(lvl); best = owareBest(b); } while(best<2);
      return { kind, board:b, best, text:'Sua vez (fileira de baixo). Qual casa captura mais sementes? Toque numa casa para testar — o tabuleiro volta ao início a cada tentativa. Quando achar a melhor, toque em Verificar.' };
    }
    let h, res;
    do { b = owareRandom(lvl); h = randInt(0,5); res = b[h]>0 ? owareSow(b,h) : null; }
    while(!res || (Math.random()<0.7 && res.captured===0) || (lvl>=4 && b[h]<6 && Math.random()<0.5));
    return { kind, board:b, h, answer:res.captured, text:`Sem semear: se você jogar a casa ${owareName(h)} (${b[h]} sementes), quantas sementes vai capturar? Conte casa por casa.` };
  },
  needsInput(ch){ return ch.kind==='prever'; },
  act(s, ch, name, v){
    if(name==='sow' && ch.kind==='captura' && ch.board[v]>0){ s.move = { h:v, res:owareSow(ch.board, v) }; }
    if(name==='reset') s.move = null;
    return true;
  },
  controls(s, ch){
    if(ch.kind==='prever') return '<p class="lab-hint">Dica: a última semente cai n casas depois da casa de saída (pulando a própria casa se der a volta).</p>';
    return `<div class="lab-row">${uiBtn('reset', null, 'Voltar ao início', {cls:'ghost', disabled:!s.move})}</div>`;
  },
  view(s, ch){
    if(ch.kind==='prever'){
      if(lab.solved){ const r = owareSow(ch.board, ch.h); return svgOware(r.board, {last:r.last, caps:r.caps}) + `<div class="lab-readout">Depois da jogada: capturou <span class="lab-big">${r.captured}</span></div>`; }
      return svgOware(ch.board, {last:ch.h});
    }
    if(!s.move) return svgOware(ch.board, {tap:true, src:ch.board}) + '<div class="lab-readout">Toque numa casa da sua fileira (com sementes) para semear.</div>';
    const r = s.move.res;
    return svgOware(r.board, {tap:true, src:ch.board, last:r.last, caps:r.caps}) + `<div class="lab-readout">
      <div>Você semeou a casa <strong>${owareName(s.move.h)}</strong> (${ch.board[s.move.h]} sementes). A última caiu em <strong>${owareName(r.last)}</strong>.</div>
      <div>Capturou: <span class="lab-big">${r.captured}</span>${r.caps.length ? ` (casas ${r.caps.slice().reverse().map(owareName).join(', ')})` : ''}</div>
      <div class="lab-hint">Toque em outra casa para comparar.</div></div>`;
  },
  check(s, ch, input){
    if(ch.kind==='prever'){
      if(parseBR(input)===ch.answer){
        const r = owareSow(ch.board, ch.h);
        return { ok:true, msg: r.captured ? `Isso: a última semente caiu em ${owareName(r.last)} e você capturou ${r.captured} (casas ${r.caps.slice().reverse().map(owareName).join(', ')}).` : `Isso: a última semente caiu em ${owareName(r.last)}, que não ficou com 2 ou 3. Nenhuma captura.` };
      }
      return { ok:false, msg:'Conte semente por semente a partir da casa seguinte. Veja onde cai a última e quantas sementes essa casa passa a ter.' };
    }
    if(!s.move) return { ok:false, msg:'Toque numa casa da sua fileira para semear.' };
    if(s.move.res.captured===ch.best) return { ok:true, msg:`A casa ${owareName(s.move.h)} captura ${ch.best} sementes — a melhor jogada deste tabuleiro.` };
    return { ok:false, msg:`Essa jogada captura ${s.move.res.captured}. Existe outra que captura mais.` };
  }
};

/* ================= Frisos e grafismos (intermediário) ================= */
const MOTIFS = [
  'M4 34V4H32V11H13V17H27V24H13V34Z',
  'M4 34V4L34 34Z',
  'M4 34V4H34V27H13V13H26V17H17V22H30V8H8V34Z',
];
const FRIEZE_RULES = {
  T:{name:'Translação', desc:'o desenho só é deslocado'},
  V:{name:'Espelho vertical', desc:'cópias espelhadas lado a lado'},
  R:{name:'Giro de 180°', desc:'meia-volta em torno de um ponto'},
  H:{name:'Espelho horizontal', desc:'reflexo para baixo, na mesma posição'},
  G:{name:'Reflexão deslizante', desc:'reflete para baixo e desliza'},
  VH:{name:'Dois espelhos', desc:'espelho vertical e horizontal juntos'},
};
function friezeCells(rule){
  // cada célula: lista de transformações a aplicar ao motivo (célula 40×80, motivo na metade de cima)
  const cells = [];
  for(let k=0;k<8;k++){
    const odd = k%2===1, t = [];
    if(rule==='T') t.push('id');
    if(rule==='V') t.push(odd?'mx':'id');
    if(rule==='R') t.push(odd?'rot':'id');
    if(rule==='H') t.push('id','my');
    if(rule==='G') t.push(odd?'my':'id');
    if(rule==='VH') t.push(odd?'mx':'id', odd?'mxy':'my');
    cells.push(t);
  }
  return cells;
}
function svgFrieze(rule, motif, label, color){
  const cw=40, W=8*cw;
  const tf = { id:'', mx:'translate(40 0) scale(-1 1)', my:'translate(0 80) scale(1 -1)', rot:'rotate(180 20 40)', mxy:'rotate(180 20 40)' };
  let g = `<rect x="0" y="0" width="${W}" height="80" fill="${C.white}" stroke="${C.line}"/><line x1="0" y1="40" x2="${W}" y2="40" stroke="${C.line}" stroke-dasharray="3 4"/>`;
  friezeCells(rule).forEach((ts, k)=>{
    ts.forEach(t=>{ g += `<g transform="translate(${k*cw} 0) ${tf[t]}"><path d="${MOTIFS[motif]}" transform="translate(1 3)" fill="${color}"/></g>`; });
  });
  return `<div class="lab-strip-label">${label}</div>` + svgWrap(W, 80, g, label);
}

/* ================= Sona angolano (intermediário → avançado) ================= */
function sonaCurves(m, n){
  // bilhar diagonal num retângulo 2m × 2n; pontos nas coordenadas ímpares
  const W=2*m, H=2*n, seen=new Set(), curves=[];
  const starts = [];
  for(let x=1;x<W;x+=2){ starts.push([x,0,1,1]); starts.push([x,H,1,-1]); }
  for(let y=1;y<H;y+=2){ starts.push([0,y,1,1]); starts.push([W,y,-1,1]); }
  for(const [sx,sy,sdx,sdy] of starts){
    if(seen.has(sx+','+sy)) continue;
    let x=sx, y=sy, dx=sdx, dy=sdy; const pts=[[x,y]]; let guard=0;
    seen.add(x+','+y);
    do {
      x+=dx; y+=dy;
      if(x===0 || x===W) dx=-dx;
      if(y===0 || y===H) dy=-dy;
      pts.push([x,y]);
      if(x===0||x===W||y===0||y===H) seen.add(x+','+y);
    } while(!(x===sx && y===sy) && ++guard<100000);
    curves.push(pts);
  }
  return curves;
}
function svgSona(m, n){
  const curves = sonaCurves(m, n);
  const W=320, H=260, pad=14;
  const u = Math.min((W-2*pad)/(2*m), (H-2*pad)/(2*n));
  const ox = (W - 2*m*u)/2, oy = (H - 2*n*u)/2;
  const P = (x,y)=>[ox + x*u, oy + y*u];
  const cols = [C.red, C.slate, C.gold, C.green, C.deep, '#8A6236', '#7B5BA6', '#C77D2E'];
  let g = '';
  curves.forEach((pts, i)=>{
    // suaviza: cantos viram curvas usando os pontos médios
    let d = '';
    const mid = (a,b)=>[(a[0]+b[0])/2, (a[1]+b[1])/2];
    const L = pts.length;
    const first = mid(pts[0], pts[1]);
    d += `M${P(...first).join(' ')}`;
    for(let k=1;k<L;k++){
      const c = pts[k], nx = pts[(k+1)%L===0 ? 1 : (k+1)%L];
      const m2 = mid(c, nx);
      d += `Q${P(...c).join(' ')} ${P(...m2).join(' ')}`;
    }
    g += `<path d="${d}" fill="none" stroke="${cols[i%cols.length]}" stroke-width="${Math.max(2, Math.min(4, u*0.35))}" stroke-linecap="round" stroke-linejoin="round"/>`;
  });
  for(let i=0;i<m;i++) for(let j=0;j<n;j++){ const [x,y] = P(2*i+1, 2*j+1); g += `<circle cx="${x}" cy="${y}" r="${Math.max(2, Math.min(4, u*0.3))}" fill="${C.ink}"/>`; }
  return { svg: svgWrap(W, H, `<rect width="${W}" height="${H}" fill="#EAD9B8" rx="6"/>` + g, `Sona de ${m} por ${n} pontos com ${curves.length} linhas`), count: curves.length };
}

/* ================= Tranças nagô (avançado) ================= */
function braidPoints(S, r, angDeg, n){
  const out = []; let x=0, y=0, a=-90*Math.PI/180;
  for(let k=0;k<n;k++){ const L = S*Math.pow(r,k); out.push({x,y,a,L}); x += L*Math.cos(a); y += L*Math.sin(a); a += angDeg*Math.PI/180; }
  return out;
}
function svgBraid(S, r, angDeg, n){
  const pts = braidPoints(S, r, angDeg, n);
  const W=320, H=300, pad=22;
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  pts.forEach(p=>{ [[p.x,p.y],[p.x+p.L*Math.cos(p.a), p.y+p.L*Math.sin(p.a)]].forEach(([x,y])=>{ minX=Math.min(minX,x-p.L*.4); maxX=Math.max(maxX,x+p.L*.4); minY=Math.min(minY,y-p.L*.4); maxY=Math.max(maxY,y+p.L*.4); }); });
  const u = Math.min((W-2*pad)/(maxX-minX||1), (H-2*pad)/(maxY-minY||1));
  const ox = (W-(maxX-minX)*u)/2 - minX*u, oy = (H-(maxY-minY)*u)/2 - minY*u;
  let g = `<rect width="${W}" height="${H}" fill="#F6EEDF" rx="6"/>`;
  pts.forEach((p, k)=>{
    const L = p.L*u, w = L*0.62, cx = ox + p.x*u, cy = oy + p.y*u, deg = p.a*180/Math.PI;
    g += `<g transform="translate(${cx} ${cy}) rotate(${deg})">
      <path d="M${L*0.05} ${-w/2}L${L*0.62} 0L${L*0.05} ${w/2}" fill="none" stroke="${k%2? '#3B2A20':'#5A4030'}" stroke-width="${Math.max(1.4, L*0.2)}" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  });
  return svgWrap(W, H, g, `Trança com ${n} trancinhas, razão ${fmtBR(r)}`);
}

const LAB_TRANCAS = {
  id:'trancas', group:'etno', stageId:8, level:'Avançado', name:'Tranças nagô', origin:'Cultura afro-brasileira e africana',
  teaser:'Progressão geométrica, séries e fractais nas tranças',
  idea:'Cada trancinha é uma cópia da anterior, um pouco menor (multiplicada pela razão r) e um pouco girada. Os tamanhos formam uma progressão geométrica: S, S·r, S·r², S·r³…',
  culture:'As tranças nagô (em inglês, cornrows) vêm de tradições africanas e são parte forte da cultura afro-brasileira. Em muitos penteados, cada trancinha é um pouco menor e mais inclinada que a anterior, formando curvas. O pesquisador Ron Eglash estudou esses padrões e mostrou que eles seguem regras de repetição com escala e rotação — a mesma ideia dos fractais e das progressões geométricas.',
  init(){ return { r:0.9, ang:8, n:12 }; },

    }
    return { kind, S, r, ans:S/(1-r), text:`Imagine a trança continuando para sempre: a primeira mede ${S} mm e cada uma tem ${pct}% da anterior. Qual seria o comprimento total de todas as trancinhas somadas?` };

  },
  view(s, ch){
    const S = ch.S, solved = lab.solved;

      <div>Última (nº ${s.n}): <span class="mono">${S} × ${fmtBR(s.r)}^${s.n-1}${solved ? ' ≈ '+fmtBR(last,2) : ''}</span></div>

      ${solved ? '' : '<div class="lab-hint">Os valores aparecem depois que você resolver o desafio.</div>'}

    }
    if(ch.kind==='quantas'){
      if(v===ch.ans) return { ok:true, msg:`A ${ch.ans}ª mede ${fmtBR(ch.S*Math.pow(ch.r,ch.ans-1),2)} mm, a primeira abaixo de ${fmtBR(ch.T)}. Dá para achar com logaritmo: k − 1 > log(${fmtBR(ch.T)}/${ch.S}) ÷ log(${fmtBR(ch.r)}).` };
      return { ok:false, msg:'Calcule os tamanhos um a um (ou use logaritmo) e veja em qual posição o tamanho passa a ficar abaixo do limite.' };
    }
    if(near(v, ch.ans, 0.05)) return { ok:true, msg:`${ch.S} ÷ (1 − ${fmtBR(ch.r)}) = ${fmtBR(ch.ans,2)} mm. Infinitas trancinhas, comprimento finito: a soma de uma PG com razão entre 0 e 1 converge.` };
    return { ok:false, msg:'Aumente o número de trancinhas e observe: a soma para de crescer e se aproxima de um valor. A fórmula da soma infinita é S ÷ (1 − r).' };
  }
};

/* ============ Soroban (ábaco japonês) — trilha de 100 exercícios ============ */
// Cada haste: 1 conta de cima (vale 5) e 4 contas de baixo (valem 1 cada).
// Uma conta "vale" quando está encostada na barra do meio.
const SOROBAN_RODS = 7;          // até 9.999.999
const SOROBAN_TOTAL = 100;
const SOROBAN_PLACES = ['1 mi', '100 mil', '10 mil', '1 mil', '100', '10', '1'];

function sorobanEmpty(){ return Array.from({length:SOROBAN_RODS}, ()=>({u:0, l:0})); }
function sorobanSet(v){
  const rods = sorobanEmpty();
  for(let i=SOROBAN_RODS-1; i>=0; i--){ const d = v%10; v = Math.floor(v/10); rods[i] = {u: d>=5 ? 1 : 0, l: d%5}; }
  return rods;
}
function sorobanValue(rods){ return rods.reduce((t, r)=>t*10 + r.u*5 + r.l, 0); }

// gerador determinístico: o exercício 37 é sempre o mesmo (bom para o professor indicar "façam o 37")
function sorobanRng(n){
  let a = (n * 2654435761) >>> 0;
  return function(lo, hi){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    const r = ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    return lo + Math.floor(r * (hi - lo + 1));
  };
}

const SOROBAN_BLOCKS = [
  { from:1,  to:20,  name:'Representar números' },
  { from:21, to:35,  name:'Ler o soroban' },
  { from:36, to:55,  name:'Adição' },
  { from:56, to:75,  name:'Subtração' },
  { from:76, to:90,  name:'Multiplicação' },
  { from:91, to:100, name:'Divisão e contas encadeadas' },
];
function sorobanBlock(n){ return SOROBAN_BLOCKS.find(b=>n>=b.from && n<=b.to); }

const TIP = {
  um:   'Cada conta de baixo vale 1. Empurre as contas para cima, até encostarem na barra.',
  cinco:'A conta de cima vale 5: desça-a até a barra e complete com as contas de baixo.',
  pos:  'Cada haste é uma posição. A haste das unidades fica à direita e tem um ponto na barra; à esquerda dela vêm dezenas, centenas…',
  zero: 'Haste com todas as contas longe da barra é um zero — mas ela continua ocupando o seu lugar.',
  ler:  'Em cada haste: 5 se a conta de cima encosta na barra, mais 1 para cada conta de baixo encostada.',
  amigo5:'Amigos do 5: quando faltam contas de baixo, troque. Para somar 4, desça o 5 e tire 1 (porque 4 = 5 − 1).',
  amigo10:'Amigos do 10: se não cabe na haste, para somar 8 tire 2 desta haste e acrescente 1 na haste da esquerda (8 = 10 − 2).',
  soma: 'Some posição por posição, da esquerda para a direita, usando os amigos do 5 e do 10 quando precisar.',
  sub5: 'Para tirar 3 de 5: levante o 5 e devolva 2 (porque 3 = 5 − 2).',
  emprest:'Empréstimo: para tirar 7 quando não há contas suficientes, tire 1 da haste da esquerda e devolva 3 nesta haste (7 = 10 − 3).',
  mult: 'Multiplique cada algarismo separadamente e vá somando os resultados parciais na posição certa, como na conta armada.',
  div:  'Veja quantas vezes o divisor cabe em cada parte, da esquerda para a direita, e deixe só o quociente no soroban.',
  enc:  'Faça uma operação de cada vez, sem zerar: o resultado de uma vira o começo da próxima.',
};

function sorobanExercise(n){
  const R = sorobanRng(n);
  const ex = (o)=>Object.assign({ n, block:sorobanBlock(n).name }, o);
  const withZero = (digits)=>{ // número com pelo menos um zero no meio
    let v; do { v = R(Math.pow(10,digits-1), Math.pow(10,digits)-1); } while(!String(v).slice(1).includes('0'));
    return v;
  };
  // 1–20: representar
  if(n<=2)  return ex({ type:'representar', target:R(1,4), tip:TIP.um });
  if(n<=5)  return ex({ type:'representar', target:R(5,9), tip:TIP.cinco });
  if(n<=10) return ex({ type:'representar', target:R(10,99), tip:TIP.pos });
  if(n<=15) return ex({ type:'representar', target:withZero(3), tip:TIP.zero });
  if(n<=18) return ex({ type:'representar', target:R(1000,9999), tip:TIP.pos });
  if(n<=20) return ex({ type:'representar', target:withZero(5), tip:TIP.zero });
  // 21–35: ler
  if(n<=25) return ex({ type:'ler', target:R(10,99), tip:TIP.ler });
  if(n<=30) return ex({ type:'ler', target:R(100,9999), tip:TIP.ler });
  if(n<=35) return ex({ type:'ler', target:withZero(n<=32 ? 5 : 6), tip:TIP.zero });
  // 36–55: adição
  if(n<=38){ const a=R(1,4), b=R(5-a, 4); return ex({ type:'conta', start:a, ops:[['+',b]], tip:TIP.amigo5 }); }
  if(n<=40){ const a=R(1,8), b=R(1, 9-a); return ex({ type:'conta', start:a, ops:[['+',b]], tip:TIP.amigo5 }); }
  if(n<=45){ let a, b; do { a=R(10,89); b=R(2,9); } while(a%10 + b < 10); return ex({ type:'conta', start:a, ops:[['+',b]], tip:TIP.amigo10 }); }
  if(n<=50){ let a, b; do { a=R(15,89); b=R(12,79); } while(a%10 + b%10 < 10 || a+b>199); return ex({ type:'conta', start:a, ops:[['+',b]], tip:TIP.amigo10 }); }
  if(n<=53){ const a=R(120,699), b=R(150,299); return ex({ type:'conta', start:a, ops:[['+',b]], tip:TIP.soma }); }
  if(n<=55){ const a=R(20,79), b=R(15,69), c=R(15,69); return ex({ type:'conta', start:a, ops:[['+',b],['+',c]], tip:TIP.enc }); }
  // 56–75: subtração
  if(n<=60){ const a=R(5,9), b=R(1, a-1); return ex({ type:'conta', start:a, ops:[['−',b]], tip:TIP.sub5 }); }
  if(n<=65){ let a, b; do { a=R(30,99); b=R(11,a-10); } while(a%10 < b%10 || Math.floor(a/10) < Math.floor(b/10)); return ex({ type:'conta', start:a, ops:[['−',b]], tip:TIP.sub5 }); }
  if(n<=70){ let a, b; do { a=R(31,99); b=R(12,a-1); } while(a%10 >= b%10); return ex({ type:'conta', start:a, ops:[['−',b]], tip:TIP.emprest }); }
  if(n<=75){ let a, b; do { a=R(400, n<=72 ? 999 : 9999); b=R(120, a-50); } while(a%10 >= b%10); return ex({ type:'conta', start:a, ops:[['−',b]], tip:TIP.emprest }); }
  // 76–90: multiplicação
  if(n<=80){ const a=R(12,99), b=R(2,9); return ex({ type:'conta', start:0, mult:[a,b], tip:TIP.mult }); }
  if(n<=85){ const a=R(102,999), b=R(3,9); return ex({ type:'conta', start:0, mult:[a,b], tip:TIP.mult }); }
  if(n<=90){ const a=R(12,99), b=R(12,99); return ex({ type:'conta', start:0, mult:[a,b], tip:TIP.mult }); }
  // 91–100: divisão e encadeadas
  if(n<=94){ const d=R(2,9), q = n<=92 ? R(12,99) : R(100,320); return ex({ type:'conta', start:d*q, ops:[['÷',d]], tip:TIP.div }); }
  if(n<=97){ const a=R(30,90); const ops=[['+',R(12,69)],['−',R(10,29)],['+',R(12,69)]]; if(n===97) ops.push(['−',R(10,24)]); /* o último menos nunca deixa negativo */ return ex({ type:'conta', start:a, ops, tip:TIP.enc }); }
  if(n<=99){ const a=R(12,99), b=R(3,9), c=R(100,999); return ex({ type:'conta', start:0, mult:[a,b], ops:[['+',c]], tip:TIP.enc }); }
  const a=R(105,999), b=R(12,99), c=R(100,999);
  return ex({ type:'conta', start:0, mult:[a,b], ops:[['−',c]], tip:'Grande final: primeiro a multiplicação, depois a subtração, tudo no soroban.' });
}
function sorobanResult(e){
  if(e.type!=='conta') return e.target;
  let v = e.mult ? e.mult[0]*e.mult[1] : e.start;
  (e.ops||[]).forEach(([op, x])=>{ v = op==='+' ? v+x : op==='−' ? v-x : v/x; });
  return v;
}
function sorobanConta(e){
  return (e.mult ? `${e.mult[0]} × ${e.mult[1]}` : String(e.start)) + (e.ops||[]).map(([o,x])=>` ${o} ${x}`).join('');
}
function sorobanText(e){
  if(e.type==='representar') return `Mostre o número <span class="lab-hl">${e.target}</span> no soroban.`;
  if(e.type==='ler') return 'Que número o soroban está mostrando?';
  const conta = sorobanConta(e);
  if(e.mult) return `Calcule <span class="lab-hl">${conta}</span> no soroban e deixe o resultado nas hastes.`;
  return `O soroban já mostra ${e.start}. Faça <span class="lab-hl">${conta}</span> e deixe o resultado nas hastes.`;
}

function sorobanDone(){ return Array.isArray(labProgress.soroban_feitos) ? labProgress.soroban_feitos : []; }
function sorobanFirstOpen(){ const d = new Set(sorobanDone()); for(let i=1;i<=SOROBAN_TOTAL;i++) if(!d.has(i)) return i; return 1; }
let sorobanNext = null;   // exercício escolhido para abrir em seguida
let sorobanGrid = false;  // grade de 100 aberta?

function svgSoroban(rods, interactive){
  const W=340, n=SOROBAN_RODS, fx=8, fw=W-16, gap=fw/n, bw=Math.min(40, gap-6), bh=22;
  const top=14, heaven=2*(bh+1), beamY=top+heaven, beamH=10, earthTop=beamY+beamH, earth=5*(bh+1), bottom=earthTop+earth;
  const wood='#5A3A22', bead='#9C3D2C', beadDark='#6E2519';
  let g = `<rect x="2" y="${top-10}" width="${W-4}" height="${bottom-top+20}" rx="8" fill="${wood}"/>
    <rect x="${fx}" y="${top}" width="${fw}" height="${bottom-top}" fill="#F3E7D1"/>`;
  const hex = (cx, y, idAttr, label, act)=>{
    const p = `${cx-bw/2},${y+bh/2} ${cx-bw/4},${y} ${cx+bw/4},${y} ${cx+bw/2},${y+bh/2} ${cx+bw/4},${y+bh} ${cx-bw/4},${y+bh}`;
    const inter = interactive ? `class="seg" role="button" tabindex="0" id="${idAttr}" aria-label="${label}" onclick="labAct('bead',${act})" onkeydown="segKey(event,'bead',${act})"` : '';
    return `<polygon points="${p}" fill="${bead}" stroke="${beadDark}" stroke-width="1.2" ${inter}/>
      <line x1="${cx-bw/2+3}" y1="${y+bh/2}" x2="${cx+bw/2-3}" y2="${y+bh/2}" stroke="${beadDark}" stroke-opacity=".5" pointer-events="none"/>`;
  };
  rods.forEach((r, i)=>{
    const cx = fx + gap*(i+0.5);
    g += `<line x1="${cx}" y1="${top}" x2="${cx}" y2="${bottom}" stroke="#7A5A3A" stroke-width="3"/>`;
    const place = SOROBAN_PLACES[i];
    // conta de cima: encostada na barra quando vale 5
    const yH = r.u ? top + bh + 2 : top + 1;
    g += hex(cx, yH, `bd-${i}-9`, `Haste ${place}: conta de cinco ${r.u ? 'encostada na barra' : 'afastada'}`, i*10+9);
    // contas de baixo: as l primeiras encostadas na barra
    for(let k=0;k<4;k++){
      const y = k < r.l ? earthTop + 1 + k*(bh+1) : earthTop + 1 + (k+1)*(bh+1);
      g += hex(cx, y, `bd-${i}-${k}`, `Haste ${place}: conta de baixo ${k+1} ${k<r.l ? 'encostada na barra' : 'afastada'}`, i*10+k);
    }
    g += `<text x="${cx}" y="${bottom+22}" text-anchor="middle" class="svg-num">${place}</text>`;
  });
  g += `<rect x="${fx}" y="${beamY}" width="${fw}" height="${beamH}" fill="${wood}"/>`;
  [0,3,6].forEach(i=>{ g += `<circle cx="${fx+gap*(i+0.5)}" cy="${beamY+beamH/2}" r="2.6" fill="#F3E7D1"/>`; });
  return svgWrap(W, bottom+32, g, `Soroban com ${n} hastes`);
}

const LAB_SOROBAN = {
  id:'soroban', group:'abaco', stageId:2, level:'100 exercícios, do básico ao avançado', name:'Soroban', origin:'Japão, adaptado no Brasil',
  teaser:'Trilha de 100 exercícios: representar, ler, somar, subtrair, multiplicar e dividir',
  idea:'Toque numa conta para movê-la. Uma conta só vale quando está encostada na barra do meio: a de cima vale 5, cada uma de baixo vale 1. Cada haste é uma posição do número.',
  culture:'O soroban é o ábaco japonês. Chegou ao Brasil com a imigração japonesa, a partir de 1908, e em 1949 o brasileiro Joaquim Lima de Moraes o adaptou para pessoas cegas — até hoje ele é usado nas escolas brasileiras no ensino de matemática para estudantes com deficiência visual. Quem treina bastante passa a “ver” o soroban na cabeça e faz contas de memória.',
  countText(){ const d = sorobanDone().length; return d ? `${d}/100` : ''; },
  init(){ return { rods:sorobanEmpty(), live:false }; },
  challenge(lvl, s){
    const n = sorobanNext || sorobanFirstOpen();
    sorobanNext = null;
    const e = sorobanExercise(n);
    const startVal = e.type==='ler' ? e.target : (e.type==='conta' ? e.start : 0);
    s.rods = sorobanSet(startVal);
    s.live = e.type==='representar' && n<=10;
    return Object.assign(e, { result:sorobanResult(e), startVal, text:sorobanText(e) });
  },
  challengeLabel(ch){ return `Exercício ${ch.n} de ${SOROBAN_TOTAL} — ${ch.block}`; },
  newLabel(solved){ return solved ? 'Próximo exercício' : 'Pular exercício'; },
  beforeNew(ch){ sorobanNext = ch.n < SOROBAN_TOTAL ? ch.n + 1 : 1; },
  onSolved(ch){
    const d = new Set(sorobanDone()); d.add(ch.n);
    labProgress.soroban_feitos = Array.from(d).sort((a,b)=>a-b);
    labProgress.soroban = labProgress.soroban_feitos.length;
  },
  header(ch){
    const done = new Set(sorobanDone());
    const grid = sorobanGrid ? `<div class="sb-grid" role="list">${Array.from({length:SOROBAN_TOTAL}, (_,i)=>i+1).map(k=>
      `<button class="sb-node ${done.has(k)?'done':''} ${k===ch.n?'cur':''}" onclick="sorobanGo(${k})" aria-label="Exercício ${k}${done.has(k)?', feito':''}">${k}</button>`).join('')}</div>
      <div class="sb-legend">${SOROBAN_BLOCKS.map(b=>`${b.from}–${b.to}: ${b.name}`).join(' | ')}</div>` : '';
    return `<div class="sb-bar"><div class="bar-track"><div class="bar-fill" style="width:${done.size}%"></div></div>
      <button class="lab-btn ghost" id="sb-toggle" onclick="sorobanToggleGrid()">${sorobanGrid ? 'Fechar lista' : `Escolher exercício (${done.size}/100 feitos)`}</button></div>${grid}`;
  },
  needsInput(ch){ return ch.type==='ler'; },
  act(s, ch, name, v){
    if(name==='bead' && ch.type!=='ler'){
      const i = Math.floor(v/10), k = v%10, r = s.rods[i];
      if(k===9) r.u = 1 - r.u;
      else r.l = k < r.l ? k : k + 1;
    }
    if(name==='clear') s.rods = sorobanEmpty();
    if(name==='restart') s.rods = sorobanSet(ch.startVal);
    return false;
  },
  controls(s, ch){
    if(ch.type==='ler') return `<p class="lab-hint">${ch.tip}</p>`;
    return `<div class="lab-row">
      ${uiBtn('clear', null, 'Zerar o soroban', {cls:'ghost'})}
      ${ch.type==='conta' && ch.startVal ? uiBtn('restart', null, `Voltar para ${ch.startVal}`, {cls:'ghost'}) : ''}
    </div><p class="lab-hint"><strong>Dica:</strong> ${ch.tip}</p>`;
  },
  view(s, ch){
    const v = sorobanValue(s.rods);
    const show = s.live || lab.solved;
    return svgSoroban(s.rods, ch.type!=='ler') + `<div class="lab-readout">
      ${show ? `<div>O soroban mostra <span class="lab-big">${v}</span></div>` : '<div class="lab-hint">O número só aparece depois que você verifica: leia as contas!</div>'}
    </div>`;
  },
  check(s, ch, input){
    const v = sorobanValue(s.rods);
    if(ch.type==='ler'){
      if(parseBR(input)===ch.target) return { ok:true, msg:`Isso: o soroban mostra ${ch.target}.` };
      return { ok:false, msg:'Leia haste por haste, da esquerda para a direita. Hastes sem contas na barra valem zero.' };
    }
    if(v===ch.result){
      if(ch.type==='representar') return { ok:true, msg:`${ch.result} no soroban!` };
      return { ok:true, msg:`${sorobanConta(ch)} = ${ch.result}.` };
    }
    if(ch.type==='representar') return { ok:false, msg:`O soroban está mostrando ${v}. Confira cada haste.` };
    return { ok:false, msg:`O soroban está mostrando ${v}, e o resultado é outro. Refaça com calma, uma posição de cada vez.` };
  }
};
function sorobanGo(k){ sorobanNext = k; sorobanGrid = false; newLabChallenge(); renderLab(); }
function sorobanToggleGrid(){ sorobanGrid = !sorobanGrid; renderLab(); }

LABS.push(LAB_SOROBAN);

/* ============ Lições: explicação, imagem e exemplo resolvido para cada tipo de exercício ============ */

/* ---- peças de desenho das lições ---- */
function lt(x, y, t, o){
  o = o || {};
  const halo = (o.f===C.white || o.nohalo) ? '' : ';stroke:#FFFDF8;stroke-width:4px;paint-order:stroke;stroke-linejoin:round';
  return `<text x="${x}" y="${y}" text-anchor="${o.a||'middle'}" class="${o.c||'lf-t'}" style="fill:${o.f||C.ink}${halo}">${t}</text>`;
}
function lfNumLine(min, max, o){
  o = o || {};
  const W=320, x0=18, x1=W-18, y=o.y||78, H=o.h||112, step=o.step||1, lab=o.lab||step;
  const X = v => x0 + (x1-x0)*(v-min)/(max-min);
  let g = `<line x1="${x0-6}" y1="${y}" x2="${x1+6}" y2="${y}" stroke="${C.ink}" stroke-width="1.5"/>`;
  for(let v=min; v<=max+1e-9; v+=step){
    g += `<line x1="${X(v)}" y1="${y-5}" x2="${X(v)}" y2="${y+5}" stroke="${C.soft}"/>`;
    if(Math.abs(Math.round((v-min)/lab)*lab-(v-min))<1e-9) g += lt(X(v), y+20, v, {c:'lf-s'});
  }
  (o.arcs||[]).forEach(([a,b,t])=>{
    const xm=(X(a)+X(b))/2, h=26;
    g += `<path d="M${X(a)} ${y}Q${xm} ${y-2*h} ${X(b)} ${y}" fill="none" stroke="${C.green}" stroke-width="2"/>`;
    g += lt(xm, y-h-6, t, {c:'lf-s', f:C.green});
  });
  if(o.ray!==undefined){
    g += `<line x1="${X(o.ray)}" y1="${y}" x2="${x1+4}" y2="${y}" stroke="${C.red}" stroke-width="5" stroke-linecap="round"/>`;
    g += `<circle cx="${X(o.ray)}" cy="${y}" r="6" fill="${C.white}" stroke="${C.red}" stroke-width="2.5"/>`;
    g += lt(X(o.ray)+60, y-18, o.rayLabel||'', {c:'lf-m', f:C.red});
  }
  (o.dots||[]).forEach(([v,col,t])=>{
    g += `<circle cx="${X(v)}" cy="${y}" r="7" fill="${col}"/>`;
    if(t) g += lt(X(v), y-16, t, {c:'lf-s', f:col});
  });
  return svgWrap(W, H, g, o.label||'Reta numérica');
}
function lfConta(lines, o){
  // lines: [{t:'47', cls}] alinhadas à direita; o.carry: texto acima; o.opRow: índice da linha com o sinal
  o = o || {};
  const W=240, cw=20, xr=170;
  let y = 26, g = '';
  const row = (s, col, size)=>{ const chars = s.split(''); chars.forEach((ch, i)=>{ const x = xr - (chars.length-1-i)*cw; g += lt(x, y, ch, {c:size||'lf-big', f:col||C.ink}); }); };
  if(o.carry){ row(o.carry, C.red, 'lf-s'); y += 24; } else y += 6;
  lines.forEach((l, i)=>{
    row(l.t, l.col);
    if(l.op) g += lt(xr - (o.width||3)*cw - 6, y, l.op, {c:'lf-big', f:C.soft});
    if(l.rule) g += `<line x1="${xr-(o.width||3)*cw-18}" y1="${y+10}" x2="${xr+12}" y2="${y+10}" stroke="${C.ink}" stroke-width="2"/>`;
    y += l.rule ? 36 : 30;
  });
  return svgWrap(W, y-6, g, o.label||'Conta armada');
}
function lfBars(bars, o){
  o = o || {};
  const W=320, x0=12, bh=30; let y=8, g='';
  const bw = bars.some(b=>b.label.length>6) ? 170 : 220;
  bars.forEach(b=>{
    for(let i=0;i<b.d;i++) g += `<rect x="${x0+i*bw/b.d}" y="${y}" width="${bw/b.d}" height="${bh}" fill="${i<b.n?(b.col||C.slate):C.white}" stroke="${C.ink}"/>`;
    g += lt(x0+bw+12, y+bh/2+5, b.label, {a:'start', c:'lf-m'});
    y += bh + 14;
  });
  return svgWrap(W, y, g, o.label||'Barras de fração');
}
function lfGrid100(n, label){
  let g=''; const c=15, o=4;
  for(let i=0;i<100;i++) g += `<rect x="${o+(i%10)*(c+1)}" y="${o+Math.floor(i/10)*(c+1)}" width="${c}" height="${c}" fill="${i<n?C.slate:C.white}" stroke="${C.line}"/>`;
  g += lt(178, 70, label, {a:'start', c:'lf-m'});
  return svgWrap(320, 170, g, label);
}
function lfPlot(win, draw, label){ const P = makePlot(win); return svgWrap(P.W, P.H, P.frame + draw(P), label); }
function lfPt(P, x, y, col, t, dx, dy){
  return `<circle cx="${P.sx(x)}" cy="${P.sy(y)}" r="5" fill="${col||C.gold}" stroke="${C.goldDark}"/>` + (t ? lt(P.sx(x)+(dx||0), P.sy(y)+(dy||-10), t, {c:'lf-s', f:C.ink}) : '');
}
function lfDash(P, x1, y1, x2, y2, col){ return `<line x1="${P.sx(x1)}" y1="${P.sy(y1)}" x2="${P.sx(x2)}" y2="${P.sy(y2)}" stroke="${col||C.soft}" stroke-width="1.5" stroke-dasharray="4 4"/>`; }
function lfArea(P, f, a, b, col){
  let d = `M${P.sx(a)} ${P.sy(0)}`;
  for(let i=0;i<=60;i++){ const x=a+(b-a)*i/60; d += `L${P.sx(x)} ${P.sy(f(x))}`; }
  d += `L${P.sx(b)} ${P.sy(0)}Z`;
  return `<path d="${d}" fill="${col||C.slate}" fill-opacity=".3"/>`;
}
function lfSeqBars(vals, col, label){
  const W=320, H=160, max=Math.max(...vals.map(Math.abs)), bw=36; let g='';
  vals.forEach((v,i)=>{ const h=(Math.abs(v)/max)*110, x=24+i*(bw+18); g += `<rect x="${x}" y="${130-h}" width="${bw}" height="${h}" rx="2" fill="${col}"/>` + lt(x+bw/2, 124-h, v, {c:'lf-m'}) + lt(x+bw/2, 148, `a${String.fromCharCode(8321+i)}`, {c:'lf-s', f:C.soft}); });
  return svgWrap(W, H, g, label);
}

    fig(){ return svgBalance({lx:2, lu:3, rx:0, ru:11}, 4); },
    ex:{ q:'3x − 17 = −44', steps:['Some 17 dos dois lados: 3x = −27.','Divida por 3: x = −9.','Confira: 3 × (−9) − 17 = −27 − 17 = −44.'], r:'−9' }, chk:()=>3*-9-17===-44 },

  inequacao:{ t:'Inequações',
    p:['Uma inequação usa >, <, ≥ ou ≤ e se resolve como uma equação: desfaça as operações dos dois lados.',
       'x + 8 > 20 vira x > 12. O menor inteiro que serve é 13 — o 12 não vale, porque 12 > 12 é falso.'],
    cap:'x > 12: bolinha aberta no 12 (ele não entra) e tudo à direita.',
    fig(){ return lfNumLine(8, 18, {ray:12, rayLabel:'x > 12', label:'x maior que 12'}); },
    ex:{ q:'Menor inteiro com x + 7 > 9', steps:['Tire 7 dos dois lados: x > 2.','O menor inteiro maior que 2 é 3.'], r:'3' }, chk:()=>3+7>9 && !(2+7>9) },

  ordem:{ t:'Ordem das operações',
    p:['1º: o que está entre parênteses.','2º: multiplicações e divisões.','3º: somas e subtrações, da esquerda para a direita.'],
    cap:'A multiplicação vem antes da soma.',
    fig(){ const g = lt(160, 30, '5 + 20 × 16', {c:'lf-big'}) + `<line x1="166" y1="40" x2="262" y2="40" stroke="${C.red}" stroke-width="3"/>`
      + lt(214, 60, '320', {c:'lf-m', f:C.red}) + lt(160, 100, '5 + 320 = 325', {c:'lf-big', f:C.green});
      return svgWrap(320, 112, g, 'Ordem das operações'); },
    ex:{ q:'(20 + 12) × 5', steps:['Parênteses primeiro: 20 + 12 = 32.','32 × 5 = 160.'], r:'160' }, chk:()=>(20+12)*5===160 && 5+20*16===325 },

  perimetro:{ t:'Perímetro',
    p:['Perímetro é o comprimento do contorno: some todos os lados.',
       'Retângulo: 2 × (base + altura). Polígono regular (lados iguais): número de lados × lado.',
       'Quadrado tem 4 lados, triângulo 3, pentágono 5, hexágono 6.'],
    cap:'Retângulo 5 × 3: 5 + 3 + 5 + 3 = 16. Pentágono de lado 4: 5 × 4 = 20.',
    fig(){ let g = `<rect x="16" y="30" width="125" height="75" fill="${C.slate}" fill-opacity=".15" stroke="${C.red}" stroke-width="3"/>` + lt(78, 24, '5', {c:'lf-m'}) + lt(150, 72, '3', {c:'lf-m', a:'start'});
      const pts=[]; for(let i=0;i<5;i++){ const a=-Math.PI/2+i*2*Math.PI/5; pts.push([240+50*Math.cos(a), 72+50*Math.sin(a)]); }
      g += `<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="${C.gold}" fill-opacity=".2" stroke="${C.red}" stroke-width="3"/>` + lt(296, 112, '4', {c:'lf-m'});
      return svgWrap(320, 130, g, 'Retângulo e pentágono'); },
    ex:{ q:'Retângulo de base 58 e altura 4', steps:['58 + 4 = 62.','2 × 62 = 124.'], r:'124' }, chk:()=>2*(58+4)===124 },

  area:{ t:'Área',
    p:['Área é quantos quadradinhos de 1 × 1 cabem dentro da figura.',
       'Quadrado: lado × lado. Retângulo: base × altura.',
       'Triângulo: base × altura ÷ 2 — ele é a metade de um retângulo. Losango: diagonal × diagonal ÷ 2.'],
    cap:'O triângulo ocupa exatamente metade do retângulo de mesma base e altura.',
    fig(){ const u=18, w=10, h=6, x0=20, y0=12; let g='';
      for(let i=0;i<w;i++) for(let j=0;j<h;j++) g+=`<rect x="${x0+i*u}" y="${y0+j*u}" width="${u}" height="${u}" fill="none" stroke="${C.line}"/>`;
      g += `<polygon points="${x0},${y0+h*u} ${x0+w*u},${y0+h*u} ${x0+w*u},${y0}" fill="${C.gold}" fill-opacity=".45" stroke="${C.red}" stroke-width="2.5"/><rect x="${x0}" y="${y0}" width="${w*u}" height="${h*u}" fill="none" stroke="${C.ink}" stroke-width="1.5"/>`;
      g += lt(x0+w*u/2, y0+h*u+18, 'base 10', {c:'lf-s'}) + lt(x0+w*u+8, y0+h*u/2, 'altura 6', {c:'lf-s', a:'start'});
      return svgWrap(320, 150, g, 'Triângulo como metade do retângulo'); },
    ex:{ q:'Triângulo de base 10 e altura 7', steps:['Retângulo 10 × 7 = 70.','O triângulo é a metade: 70 ÷ 2 = 35.'], r:'35' }, chk:()=>10*7/2===35 },

  pitagoras:{ t:'Teorema de Pitágoras',
    p:['No triângulo retângulo, o lado oposto ao ângulo reto é a hipotenusa (o maior). Os outros dois são os catetos.',
       'Hipotenusa² = cateto² + cateto².',
       'Para achar um cateto: cateto² = hipotenusa² − outro cateto².'],
    cap:'9 + 16 = 25: as áreas dos quadrados menores somam a do maior.',
    fig(){ return svgTri({a:3, b:4}, true); },
    ex:{ q:'Hipotenusa 17 e um cateto 8. Qual é o outro cateto?', steps:['17² = 289 e 8² = 64.','289 − 64 = 225.','√225 = 15.'], r:'15' }, chk:()=>17*17-8*8===225 && 15*15===225 },

  angulos:{ t:'Ângulos',
    p:['A soma dos três ângulos internos de qualquer triângulo é 180°.',
       'Ângulos complementares somam 90°; suplementares somam 180°.'],
    cap:'62° + 63° + 55° = 180°.',
    fig(){ const A=[30,140], B=[290,140], Cc=[150,24];
      let g = `<polygon points="${[A,B,Cc].map(p=>p.join(',')).join(' ')}" fill="${C.slate}" fill-opacity=".12" stroke="${C.ink}" stroke-width="2"/>`;
      g += lt(70, 130, '62°', {c:'lf-m', f:C.slate}) + lt(250, 130, '63°', {c:'lf-m', f:C.slate}) + lt(150, 58, '?', {c:'lf-big', f:C.red});
      return svgWrap(320, 154, g, 'Ângulos de um triângulo'); },
    ex:{ q:'Triângulo com ângulos de 45° e 67°. E o terceiro?', steps:['45 + 67 = 112.','180 − 112 = 68.'], r:'68°' }, chk:()=>180-45-67===68 },

  volume:{ t:'Volume',
    p:['Volume é quantos cubinhos de 1 × 1 × 1 cabem dentro do sólido.',
       'Paralelepípedo (caixa): comprimento × largura × altura. Cubo: aresta × aresta × aresta.'],
    cap:'Caixa 3 × 2 × 2 = 12 cubinhos.',
    fig(){ const u=30, ox=120, oy=120, c30=Math.cos(Math.PI/6), s30=0.5;
      const P=(x,y,z)=>[ox+(x-y)*c30*u, oy+(x+y)*s30*u-z*u];
      const face=(pts,col)=>`<polygon points="${pts.map(p=>P(...p).join(',')).join(' ')}" fill="${col}" stroke="${C.ink}" stroke-width="1.2"/>`;
      const L=3, Wd=2, H=2; let g='';
      g += face([[0,0,H],[L,0,H],[L,Wd,H],[0,Wd,H]], '#D9E2EA') + face([[L,0,0],[L,Wd,0],[L,Wd,H],[L,0,H]], '#B9C8D6') + face([[0,Wd,0],[L,Wd,0],[L,Wd,H],[0,Wd,H]], '#9FB3C6');
      const ln=(a,b)=>{ const p=P(...a), q=P(...b); return `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${C.ink}" stroke-opacity=".5"/>`; };
      for(let i=1;i<L;i++){ g+=ln([i,0,H],[i,Wd,H]) + ln([i,Wd,0],[i,Wd,H]); }
      for(let j=1;j<Wd;j++){ g+=ln([0,j,H],[L,j,H]) + ln([L,j,0],[L,j,H]); }
      for(let k=1;k<H;k++){ g+=ln([L,0,k],[L,Wd,k]) + ln([0,Wd,k],[L,Wd,k]); }
      g += lt(268, 70, '3 × 2 × 2', {c:'lf-m'}) + lt(268, 96, '= 12', {c:'lf-m', f:C.green});
      return svgWrap(320, 180, g, 'Caixa de cubinhos'); },
    ex:{ q:'Cubo de aresta 5', steps:['5 × 5 × 5.','25 × 5 = 125.'], r:'125' }, chk:()=>5**3===125 },

  'f-avaliar':{ t:'Calcular o valor de uma função',
    p:['f(x) é uma regra: entra um número x, sai um resultado.',
       'Para calcular f(−3), troque cada x por (−3) — com parênteses — e faça as contas na ordem: potências, multiplicações, somas.',
       'Atenção: (−3)² = 9, mas −3² seria −9. Por isso os parênteses.'],
    cap:'Gráfico de f(x) = 3x² − 11 com o ponto (−3, 16).',
    fig(){ return lfPlot({x0:-4,x1:4,y0:-14,y1:40,gx:1,gy:5,lx:2,ly:10}, P=>P.curve(x=>3*x*x-11, C.slate)+lfPt(P,-3,16,C.gold,'(−3, 16)',30,4), 'Parábola'); },
    ex:{ q:'f(x) = 3x² − 11. Quanto é f(−3)?', steps:['Troque x por (−3): 3 × (−3)² − 11.','(−3)² = 9, então 3 × 9 − 11.','27 − 11 = 16.'], r:'16' }, chk:()=>3*(-3)**2-11===16 },

  'f-zero':{ t:'Zero (raiz) de uma função',
    p:['O zero de f é o valor de x que faz f(x) = 0. No gráfico, é onde a linha cruza o eixo x.',
       'Para encontrá-lo, iguale a expressão a zero e resolva a equação.'],
    cap:'f(x) = 2x − 6 cruza o eixo x em x = 3.',
    fig(){ return lfPlot({x0:-2,x1:6,y0:-8,y1:6,gx:1,gy:2,lx:1,ly:2}, P=>P.curve(x=>2*x-6, C.slate)+lfPt(P,3,0,C.red,'x = 3',0,-12), 'Reta cortando o eixo x'); },
    ex:{ q:'Zero de f(x) = 4x − 44', steps:['4x − 44 = 0.','4x = 44.','x = 11.'], r:'11' }, chk:()=>4*11-44===0 },

  inclinacao:{ t:'Inclinação e coeficiente linear',
    p:['Toda reta (não vertical) tem a forma y = ax + b.',
       'Inclinação: a = (y₂ − y₁) ÷ (x₂ − x₁) — quanto y muda para cada passo de x.',
       'Coeficiente linear b é onde a reta corta o eixo y (o y quando x = 0). Conhecendo a e um ponto, b = y − a·x.'],
    cap:'De (1, 2) a (3, 6): y sobe 4 enquanto x anda 2, então a = 2.',
    fig(){ return lfPlot({x0:-1,x1:5,y0:-2,y1:10,gx:1,gy:2,lx:1,ly:2}, P=>P.curve(x=>2*x, C.slate)+lfDash(P,1,2,3,2,C.green)+lfDash(P,3,2,3,6,C.red)
      +lt(P.sx(2),P.sy(2)+16,'Δx = 2',{c:'lf-s',f:C.green})+lt(P.sx(3)+30,P.sy(4),'Δy = 4',{c:'lf-s',f:C.red})+lfPt(P,1,2)+lfPt(P,3,6), 'Inclinação'); },
    ex:{ q:'Inclinação da reta por (−2, −3) e (−4, −11)', steps:['Δy = −11 − (−3) = −8.','Δx = −4 − (−2) = −2.','a = −8 ÷ (−2) = 4.'], r:'4' }, chk:()=>(-11+3)/(-4+2)===4 },

  derivada:{ t:'Derivada de potências',
    p:['A derivada mede a inclinação da curva em cada ponto: o quanto ela sobe ou desce ali.',
       'Regra da potência: a derivada de c·xⁿ é c·n·xⁿ⁻¹. O expoente desce multiplicando e diminui 1.',
       'Numa soma, derive cada termo separadamente.'],
    cap:'A tangente a y = x² no ponto x = 1 tem inclinação 2 = 2·1.',
    fig(){ return lfPlot({x0:-1,x1:3,y0:-2,y1:6,gx:1,gy:1,lx:1,ly:2}, P=>P.curve(x=>x*x, C.slate)+P.curve(x=>2*x-1, C.red, 1.8)+lfPt(P,1,1,C.gold,'(1, 1)',-24,-6), 'Tangente à parábola'); },
    ex:{ q:'Derivada de 4x⁵ + 5x⁴', steps:['4x⁵ → 4 · 5 · x⁴ = 20x⁴.','5x⁴ → 5 · 4 · x³ = 20x³.'], r:'20x⁴ + 20x³' }, chk:()=>4*5===20 && 5*4===20 },

  integral:{ t:'Integral (antiderivada) de potências',
    p:['Integrar é o caminho de volta da derivada: achar a função cuja derivada é a que você tem.',
       'Regra: a integral de c·xⁿ é c·xⁿ⁺¹ ÷ (n + 1) + C. O expoente sobe 1 e você divide pelo novo expoente.',
       'O + C aparece porque constantes somem ao derivar: x² e x² + 7 têm a mesma derivada.'],
    cap:'Derivar x² dá 2x; integrar 2x dá x² + C.',
    fig(){ return lfPlot({x0:-2,x1:3,y0:-3,y1:6,gx:1,gy:1,lx:1,ly:2}, P=>P.curve(x=>x*x, C.slate)+P.curve(x=>2*x, C.red)+lt(P.sx(2.3),P.sy(5.3),'x²',{c:'lf-m',f:C.slate})+lt(P.sx(2.7),P.sy(3.3),'2x',{c:'lf-m',f:C.red}), 'x² e 2x'); },
    ex:{ q:'Integral de 24x³', steps:['O expoente sobe para 4: x⁴.','Divida pelo novo expoente: 24 ÷ 4 = 6.','Confira derivando: 6 · 4x³ = 24x³.'], r:'6x⁴ + C' }, chk:()=>24/4===6 && 6*4===24 },

  eq2grau:{ t:'Equação do 2º grau',
    p:['Forma: ax² + bx + c = 0. As raízes são onde a parábola cruza o eixo x.',
       'Fórmula de Bhaskara: x = (−b ± √Δ) ÷ 2a, com Δ = b² − 4ac.',
       'Atalho quando a = 1: as raízes somam −b e se multiplicam dando c.'],
    cap:'x² + 2x − 8 = 0 tem raízes −4 e 2 (soma −2, produto −8).',
    fig(){ return lfPlot({x0:-6,x1:4,y0:-10,y1:12,gx:1,gy:2,lx:2,ly:4}, P=>P.curve(x=>x*x+2*x-8, C.slate)+lfPt(P,-4,0,C.red,'−4',0,-12)+lfPt(P,2,0,C.red,'2',0,-12), 'Parábola com duas raízes'); },
    ex:{ q:'x² + 14x + 13 = 0. Qual é a menor raiz?', steps:['As raízes somam −14 e têm produto 13.','Os números são −1 e −13: (−1) + (−13) = −14 e (−1)(−13) = 13.','A menor é −13.'], r:'−13' }, chk:()=>(-1)+(-13)===-14 && (-1)*(-13)===13 },

  discriminante:{ t:'Discriminante (Δ)',
    p:['Δ = b² − 4ac diz quantas raízes reais a equação tem.',
       'Δ > 0: duas raízes. Δ = 0: uma raiz (dupla). Δ < 0: nenhuma raiz real — a parábola não toca o eixo x.',
       'Atenção aos sinais: se c for negativo, −4ac fica positivo.'],
    cap:'Da esquerda para a direita: Δ > 0, Δ = 0 e Δ < 0.',
    fig(){ return lfPlot({x0:-6,x1:6,y0:-2,y1:6,gx:1,gy:1,lx:2,ly:2}, P=>P.curve(x=>(x+3.5)**2-1, C.green)+P.curve(x=>x*x, C.slate)+P.curve(x=>(x-3.5)**2+1, C.red)
      +lt(P.sx(-3.5),P.sy(-1)+16,'Δ > 0',{c:'lf-s',f:C.green})+lt(P.sx(0),P.sy(0)+16,'Δ = 0',{c:'lf-s',f:C.slate})+lt(P.sx(3.5),P.sy(1)+16,'Δ < 0',{c:'lf-s',f:C.red}), 'Três parábolas'); },
    ex:{ q:'Δ de 4x² − 5x + 12 = 0', steps:['a = 4, b = −5, c = 12.','b² = 25 e 4ac = 4 × 4 × 12 = 192.','Δ = 25 − 192 = −167 (sem raízes reais).'], r:'−167' }, chk:()=>25-4*4*12===-167 },

  sistemas:{ t:'Sistemas de equações',
    p:['Duas equações e duas incógnitas: a solução é o ponto onde as duas retas se cruzam.',
       'Método da adição: some ou subtraia as equações para eliminar uma letra.',
       'Achou uma letra? Substitua numa das equações para achar a outra.'],
    cap:'x + y = 5 e x − y = 1 se cruzam em (3, 2).',
    fig(){ return lfPlot({x0:-1,x1:6,y0:-2,y1:6,gx:1,gy:1,lx:1,ly:1}, P=>P.curve(x=>5-x, C.slate)+P.curve(x=>x-1, C.gold)+lfPt(P,3,2,C.red,'(3, 2)',26,-4), 'Duas retas'); },
    ex:{ q:'2x + 8y = −92 e 2x + 4y = −44. Quanto vale y?', steps:['Subtraia a 2ª equação da 1ª: 8y − 4y = −92 − (−44).','4y = −48.','y = −12.'], r:'−12' }, chk:()=>-92+44===-48 && -48/4===-12 },

  polinomio:{ t:'Valor numérico de polinômios',
    p:['Substitua x pelo número (com parênteses) e calcule termo a termo.',
       'Potência de negativo: expoente par dá positivo, ímpar dá negativo. (−2)² = 4 e (−2)³ = −8.',
       'Some tudo no final, com atenção aos sinais.'],
    cap:'p(x) = −3x³ + 2x² + 7x + 7 passa por (3, −35).',
    fig(){ return lfPlot({x0:-2.5,x1:3.5,y0:-40,y1:30,gx:1,gy:10,lx:1,ly:20}, P=>P.curve(x=>-3*x**3+2*x*x+7*x+7, C.slate)+lfPt(P,3,-35,C.gold,'(3, −35)',-34,0), 'Polinômio'); },
    ex:{ q:'p(x) = −3x³ + 2x² + 7x + 7. Quanto é p(3)?', steps:['−3 × 3³ = −3 × 27 = −81.','2 × 3² = 18 e 7 × 3 = 21.','−81 + 18 + 21 + 7 = −35.'], r:'−35' }, chk:()=>-3*27+18+21+7===-35 },

  trig:{ t:'Seno, cosseno e tangente',
    p:['No círculo de raio 1, cada ângulo marca um ponto: o cosseno é a coordenada x e o seno é a coordenada y. A tangente é seno ÷ cosseno.',
       'Ângulos notáveis: sen 30° = 0,5; sen 45° ≈ 0,707; sen 60° ≈ 0,866. O cosseno é a mesma lista ao contrário (cos 30° ≈ 0,866, cos 60° = 0,5).',
       'Em 90°, 180°, 270°, 360° o ponto cai sobre um eixo: os valores são 0, 1 ou −1. Nos outros quadrantes, os valores se repetem com sinal: sen 210° = −0,5.'],
    cap:'Ângulo de 30°: o ponto é (cos 30°, sen 30°) ≈ (0,866; 0,5).',
    fig(){ const cx=150, cy=140, r=110, a=Math.PI/6, px=cx+r*Math.cos(a), py=cy-r*Math.sin(a);
      let g=`<line x1="20" y1="${cy}" x2="290" y2="${cy}" stroke="${C.soft}"/><line x1="${cx}" y1="18" x2="${cx}" y2="262" stroke="${C.soft}"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${C.slate}" stroke-width="2"/>`;
      g+=`<line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}" stroke="${C.ink}" stroke-width="2"/><line x1="${px}" y1="${py}" x2="${px}" y2="${cy}" stroke="${C.red}" stroke-width="2.5"/><line x1="${cx}" y1="${cy}" x2="${px}" y2="${cy}" stroke="${C.green}" stroke-width="4"/>`;
      g+=`<path d="M${cx+30} ${cy}A30 30 0 0 0 ${cx+30*Math.cos(a)} ${cy-30*Math.sin(a)}" fill="none" stroke="${C.ink}"/><circle cx="${px}" cy="${py}" r="5" fill="${C.gold}"/>`;
      g+=lt(cx+48, cy-6, '30°', {c:'lf-s'})+lt(cx+r*0.43, cy+18, 'cos', {c:'lf-s', f:C.green})+lt(px+22, cy-26, 'sen', {c:'lf-s', f:C.red})+lt(px-6, py-14, '(0,866; 0,5)', {c:'lf-s', a:'middle'});
      return svgWrap(320, 270, g, 'Círculo trigonométrico'); },
    ex:{ q:'cos(60°)', steps:['cos 60° tem o mesmo valor que sen 30°.','sen 30° = 0,5.'], r:'0,5' }, chk:()=>near(Math.cos(Math.PI/3),0.5) },

  radianos:{ t:'Graus e radianos',
    p:['Uma volta completa tem 360°, que é o mesmo que 2π radianos. Então 180° = π rad.',
       'Graus → radianos: multiplique por π e divida por 180.',
       'Radianos → graus: multiplique por 180 e divida por π (≈ 3,1416).'],
    cap:'Meia volta: 180° = π ≈ 3,14 rad. Um quarto de volta: 90° = π/2.',
    fig(){ const cx=160, cy=118, r=90;
      let g=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${C.line}" stroke-width="2"/><path d="M${cx+r} ${cy}A${r} ${r} 0 0 0 ${cx-r} ${cy}" fill="none" stroke="${C.red}" stroke-width="5"/>`;
      g+=`<line x1="${cx-r-10}" y1="${cy}" x2="${cx+r+10}" y2="${cy}" stroke="${C.soft}"/><line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-r}" stroke="${C.soft}" stroke-dasharray="4 4"/>`;
      g+=lt(cx, cy-r-10, '90° = π/2', {c:'lf-s'})+lt(cx, cy+30, '180° = π rad', {c:'lf-m', f:C.red});
      return svgWrap(320, 216, g, 'Meia volta'); },
    ex:{ q:'45° em radianos', steps:['45 × π ÷ 180 = π/4.','π/4 ≈ 3,1416 ÷ 4 ≈ 0,7854.'], r:'0,7854' }, chk:()=>near(45*Math.PI/180, 0.7854, 0.0001) },

  'lei-cossenos':{ t:'Lei dos cossenos',
    p:['Vale para qualquer triângulo: c² = a² + b² − 2ab·cos C, onde C é o ângulo entre os lados a e b.',
       'Se C = 90°, cos 90° = 0 e a fórmula vira Pitágoras. Lembre: cos 60° = 0,5 e cos 120° = −0,5.'],
    cap:'Lados 5 e 7 com 120° entre eles: o lado c fica oposto ao ângulo.',
    fig(){ const Cv=[90,170], u=25, B=[Cv[0]+7*u, Cv[1]], A=[Cv[0]+5*u*Math.cos(2*Math.PI/3), Cv[1]-5*u*Math.sin(2*Math.PI/3)];

/* ---- mostrar as lições ---- */
function levelLessons(level){
  const ids = [];
  level.gens.forEach(g=>{ const id = FAMILY_LESSON[g.fam]; if(id && LESSONS[id] && !ids.includes(id)) ids.push(id); });
  return ids;
}
function stageLessons(stage){
  const ids = [];
  stage.levels.forEach(l=>levelLessons(l).forEach(id=>{ if(!ids.includes(id)) ids.push(id); }));
  return ids;
}
function lessonHtml(id){
  const L = LESSONS[id];
  return `${typeof lessonVideo==='function' ? lessonVideo(id) : ''}<figure class="lesson-fig">${L.fig()}<figcaption>${L.cap}</figcaption></figure>
    ${L.p.map(t=>`<p>${t}</p>`).join('')}
    <div class="lesson-ex">
      <div class="lex-label">Exemplo resolvido</div>
      <div class="lex-q" data-k="0">${L.ex.q}</div>
      <ol>${L.ex.steps.map((s,i)=>`<li data-k="${i+1}">${s}</li>`).join('')}</ol>
      <div class="lex-r">Resposta: <strong>${L.ex.r}</strong></div>
    </div>`;
}
function lessonList(ids, openFirst){
  return ids.map((id, i)=>`<details class="lesson" ${openFirst && i===0 ? 'open' : ''}>
    <summary>${LESSONS[id].t}</summary><div class="lesson-inner">${lessonHtml(id)}</div></details>`).join('');
}

// tela "Antes de começar" e explicação aberta durante a folha
function startSheet(){ current.intro = false; render(); }
function openLessonSheet(){
  const inp = document.getElementById('ws-answer-input');
  if(inp) current.draft = inp.value;
  const q = current.questions[current.qIndex];
  current.sheet = FAMILY_LESSON[q.fam] || null;
  render();
}
function closeLessonSheet(){ current.sheet = null; render(); }
function renderLessonIntro(){
  const ids = levelLessons(current.level);
  const stage = STAGES[current.stageIdx];
  app.innerHTML = `
    <div class="worksheet">
      <div class="ws-header">
        <div class="ws-title">Estágio ${stage.id} — ${current.level.name}</div>
        <button class="ws-close" onclick="closeWorksheet()">fechar ✕</button>
      </div>
      <div class="ws-intro">
        <h2>Antes de começar</h2>
        <p class="ws-intro-sub">${ids.length===1 ? 'Esta folha treina um assunto.' : `Esta folha mistura ${ids.length} assuntos.`} Leia a explicação, veja o exemplo resolvido e depois resolva as 10 questões. Durante a folha, o botão “Ver explicação” traz este conteúdo de volta.</p>
        ${lessonList(ids, true)}
      </div>
      <div class="ws-footer">
        <button class="btn" style="width:100%;" id="ws-start" onclick="startSheet()">Começar a folha</button>
      </div>
    </div>`;
  const b = document.getElementById('ws-start'); if(b) b.focus({preventScroll:true});
}
function lessonSheetHtml(id){
  if(!id || !LESSONS[id]) return '';
  return `<div class="lesson-sheet" role="dialog" aria-modal="true" aria-label="Explicação: ${LESSONS[id].t}">
    <div class="ls-panel">
      <div class="ls-head"><strong>${LESSONS[id].t}</strong><button class="ws-close" id="ls-close" onclick="closeLessonSheet()">voltar à questão ✕</button></div>
      <div class="ls-body">${lessonHtml(id)}</div>
    </div></div>`;
}

// tela com todas as explicações de um estágio (aberta pelo mapa)
let lessonsStageIdx = 0;
function openStageLessons(sIdx){ lessonsStageIdx = sIdx; screen = 'licoes'; render(); window.scrollTo(0,0); }
function renderStageLessons(){
  const st = STAGES[lessonsStageIdx];
  const ids = stageLessons(st);
  app.innerHTML = `
    <div class="app-header">
      <button class="lab-back" onclick="backToMap()">‹ Mapa das folhas</button>
      <h1>Estágio ${st.id}: ${st.name}</h1>
      <div class="sub">${ids.length} explicações, com imagem e exemplo resolvido. Toque num assunto para abrir.</div>
    </div>
    <div class="map lessons-page">${lessonList(ids, true)}</div>`;
}

// mostrar decimais com vírgula e expoentes como sobrescrito
const SUP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
function prettyMath(s){
  return String(s).replace(/(\d)\.(\d)/g, '$1,$2').replace(/\^(-?\d+)/g, (m, e)=>e.split('').map(ch=>SUP[ch]||ch).join(''));
}

/* ============ Vídeos explicativos (um por lição, na pasta videos/) ============ */
const VIDEO_DIR = 'videos/';
function lessonVideo(id){
  return `<figure class="lesson-video">
    <video src="${VIDEO_DIR}${id}.mp4" poster="${VIDEO_DIR}${id}.jpg" controls preload="metadata" playsinline
      aria-label="Vídeo explicativo: ${LESSONS[id].t}" onerror="lessonVideoMissing(this)"></video>
    <figcaption>Vídeo explicativo com narração e legendas</figcaption>
  </figure>`;
}
// sem a pasta de vídeos (por exemplo, o HTML aberto sozinho), o espaço do vídeo some
function lessonVideoMissing(v){ const f = v.closest('figure'); if(f) f.hidden = true; }
// ao trocar de tela, nenhum vídeo continua tocando
function animStopAll(){ document.querySelectorAll('video').forEach(v=>{ try{ v.pause(); }catch(e){} }); }
// ao abrir um vídeo, pausa os outros
document.addEventListener('play', e=>{ document.querySelectorAll('video').forEach(v=>{ if(v!==e.target) v.pause(); }); }, true);

function lessonIcon(){
  return `<svg viewBox="0 0 44 44" aria-hidden="true"><path d="M6 10Q14 6 22 10Q30 6 38 10V36Q30 32 22 36Q14 32 6 36Z" fill="${C.white}" stroke="${C.slate}" stroke-width="2"/><line x1="22" y1="10" x2="22" y2="36" stroke="${C.slate}" stroke-width="2"/><path d="M10 16H18M10 21H18M26 16H34M26 21H32" stroke="${C.gold}" stroke-width="2"/></svg>`;
}

/* ============ Rendering ============ */
const app = document.getElementById('app');

function render(){
  if(typeof animStopAll==='function') animStopAll();
  if(screen==='welcome') return renderWelcome();
  if(screen==='map') return renderMap();
  if(screen==='worksheet') return renderWorksheet();
  if(screen==='results') return renderResults();
  if(screen==='labs') return renderLabs();
  if(screen==='lab') return renderLab();
  if(screen==='licoes') return renderStageLessons();
}

function renderWelcome(){
  app.innerHTML = `
    <div class="app-header">
      <h1>Método das Folhas</h1>
      <div class="sub">Matemática do zero ao avançado, um problema de cada vez</div>
    </div>
    <div class="welcome">
      <p>Este jogo segue os mesmos princípios de métodos de estudo individualizado por domínio: doses curtas, correção imediata e avanço só depois que a base está firme.</p>
      <ul class="method-points">
        <li><span class="mark">01</span> Cada folha começa com uma explicação ilustrada e um exemplo resolvido. Depois vêm 10 exercícios, um de cada vez, sem pressa.</li>
        <li><span class="mark">02</span> A correção é imediata — você sabe na hora se acertou.</li>
        <li><span class="mark">03</span> Todas as folhas estão abertas: comece por onde quiser. Com 80% de acerto a folha fica aprovada; com 95%, ganha medalha de ouro.</li>
        <li><span class="mark">04</span> São 300 folhas em 13 estágios: de contagem básica (estágios 1 a 8) até cálculo, números complexos e matrizes na trilha avançada (estágios 9 a 13).</li>
        <li><span class="mark">05</span> No Laboratório visual, 15 jogos para mexer com as mãos — de material dourado e frações a quipus incas, sona angolano, tranças nagô e um soroban com 100 exercícios.</li>
      </ul>
      <p style="font-size:0.82rem;">${storageAvailable ? 'Seu progresso é salvo automaticamente neste navegador — pode voltar quando quiser.' : 'Este ambiente não salva automaticamente; abra o arquivo baixado direto no navegador para ativar o salvamento.'}</p>
      <div class="btn-row">
        <button class="btn" onclick="startApp()">Começar</button>
        <button class="btn secondary" onclick="openLabs()">Abrir o laboratório</button>
      </div>
    </div>
  `;
}

function startApp(){ screen='map'; render(); }

function renderMap(){
  const done = overallDone();
  const pct = Math.round((done/TOTAL_LEVELS)*100);
  let stagesHtml = '';
  STAGES.forEach((stage, sIdx)=>{
    const track = stage.track || 'base';
    if(sIdx===0 || track !== (STAGES[sIdx-1].track || 'base')){
      stagesHtml += track==='avancado'
        ? `<h2 class="map-section">Trilha avançada</h2><p class="map-section-sub">Estágios 9 a 13, com 20 folhas cada: álgebra avançada, trigonometria, geometria analítica, cálculo diferencial e integral.</p>`
        : `<h2 class="map-section">Do zero ao avançado</h2><p class="map-section-sub">Estágios 1 a 8, com 25 folhas cada: de contagem até funções, derivada e integral.</p>`;
    }
    const stageUnlocked = isLevelUnlocked(sIdx, 0);
    const isOpen = openStageId===stage.id;
    const doneInStage = stage.levels.filter(l=>progress[l.id] && progress[l.id].passed).length;
    let levelsHtml = `<button class="stage-lab-link" onclick="openStageLessons(${sIdx})">${lessonIcon()}<span>Explicações do estágio: ${stageLessons(stage).length} assuntos com exemplos ›</span></button>` + LABS.filter(l=>l.stageId===stage.id).map(l=>`<button class="stage-lab-link" onclick="openLab('${l.id}','map')">${labIcon(l.id)}<span>${l.group==='etno' ? 'Etnomatemática' : (l.group==='abaco' ? 'Ábaco' : 'Laboratório')}: ${l.name} ›</span></button>`).join('');
    levelsHtml += `<div class="stage-summary">${doneInStage}/${stage.levels.length} folhas concluídas</div>`;
    stage.levels.forEach((lvl, lIdx)=>{
      const unlocked = isLevelUnlocked(sIdx, lIdx);
      const p = progress[lvl.id];
      let medalCls = '';
      if(p && p.passed) medalCls = p.medal==='gold' ? 'medal-gold' : 'medal-silver';
      else if(unlocked) medalCls = 'medal-none';
      levelsHtml += `
        <div class="level-node ${unlocked?'':'locked'} ${medalCls}" title="${lvl.name}" ${unlocked?`onclick="openLevel(${sIdx},${lIdx})"`:''}>
          ${unlocked ? (lIdx+1) : '🔒'}
        </div>`;
    });
    stagesHtml += `
      <div class="stage-card ${isOpen?'open':''}">
        <div class="stage-head ${stageUnlocked?'':'locked'}" onclick="toggleStage(${stage.id})">
          <div class="stage-num">${String(stage.id).padStart(2,'0')}</div>
          <div class="stage-title">
            <div class="name">${stage.name}</div>
            <div class="tag">${stage.tag}</div>
          </div>
          ${stageUnlocked ? `<div class="stage-caret">›</div>` : `<div class="stage-lock-icon">🔒</div>`}
        </div>
        <div class="stage-levels">${levelsHtml}</div>
      </div>`;
  });

  app.innerHTML = `
    <div class="app-header">
      <h1>Método das Folhas</h1>
      <div class="overall-progress">
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="label"><span>${done}/${TOTAL_LEVELS} folhas concluídas</span><span>${pct}%</span></div>
      </div>
      <button class="lab-entry" onclick="openLabs()">
        ${labIcon('fracoes')}
        <span class="lc-text"><span class="name">Laboratório visual</span><span class="tag">15 jogos para mexer, com etnomatemática e soroban (100 exercícios)</span></span>
        <span class="lc-go" aria-hidden="true">›</span>
      </button>
    </div>
    <div class="map">${stagesHtml}</div>
    <div class="footnote">
      ${storageAvailable
        ? 'Seu progresso é salvo automaticamente neste navegador — pode fechar e continuar depois de onde parou.'
        : 'Este ambiente não permite salvar automaticamente. Baixe o arquivo e abra-o direto no navegador (ou hospede no GitHub Pages) para o salvamento funcionar.'}
      <br>Estágios 1 a 8 têm 25 folhas e estágios 9 a 13 (trilha avançada) têm 20, sempre com dificuldade crescendo aos poucos. Os laboratórios ficam abertos desde o início, para explorar quando quiser.
      <br><button onclick="resetProgress()">Reiniciar progresso</button>
    </div>
  `;
}

function toggleStage(stageId){
  if(stageId>7 && !hasFullAccess()){
    alert('Este estágio faz parte do jogo completo: R$ 49,90, pagamento único. Compre no site Mestres Griots para liberar.');
    return;
  }
  openStageId = (openStageId===stageId) ? null : stageId;
  render();
}
function resetProgress(){
  progress = {};
  labProgress = {};
  if(storageAvailable){
    try{ window.localStorage.removeItem(STORAGE_KEY); window.localStorage.removeItem(LAB_STORAGE_KEY); } catch(e){ /* ignore */ }
  }
  render();
}

function openLevel(stageIdx, levelIdx){
  const level = STAGES[stageIdx].levels[levelIdx];
  const questions = [];
  for(let i=0;i<QUESTIONS_PER_SHEET;i++) questions.push(generateQuestion(level));
  current = {
    stageIdx, levelIdx, level, questions,
    qIndex:0, correctCount:0, startTime:Date.now(),
    awaitingNext:false, selectedMc:null, intro:true, sheet:null, draft:''
  };
  screen='worksheet';
  render();
}

function renderWorksheet(){
  if(current.intro) return renderLessonIntro();
  const q = current.questions[current.qIndex];
  let inputHtml = '';
  if(q.type==='mc'){
    inputHtml = `<div class="ws-mc-options">` + q.options.map((opt,i)=>
      `<button class="ws-mc-btn ${current.selectedMc===i?'selected':''}" onclick="selectMc(${i})">${prettyMath(opt)}</button>`
    ).join('') + `</div>`;
  } else {
    inputHtml = `<input class="ws-input" id="ws-answer-input" type="text" inputmode="decimal" autocomplete="off" placeholder="?" value="${!current.awaitingNext && current.draft ? current.draft : ''}" ${current.awaitingNext?'disabled':''}>`;
  }

  let feedbackHtml = '';
  if(current.awaitingNext){
    const wasCorrect = current.lastCorrect;
    feedbackHtml = `
      <div class="ws-feedback">
        <div class="ws-stamp ${wasCorrect?'correct':'wrong'}">${wasCorrect?'✓':'✗'}</div>
        ${!wasCorrect ? `<div class="ws-correct-answer">resposta: ${prettyMath(formatAnswer(q))}</div><button class="ws-learn" onclick="openLessonSheet()">Entenda como resolver</button>` : ''}
      </div>`;
  } else {
    feedbackHtml = `<div class="ws-feedback"></div>`;
  }

  app.innerHTML = `
    <div class="worksheet">
      <div class="ws-header">
        <div class="ws-title">${current.level.name}</div>
        <div class="ws-actions">
          <button class="ws-help" onclick="openLessonSheet()">Ver explicação</button>
          <button class="ws-close" onclick="closeWorksheet()">fechar ✕</button>
        </div>
      </div>
      <div class="ws-body">
        <div class="ws-progress" style="margin-bottom:14px;">Questão ${current.qIndex+1} de ${QUESTIONS_PER_SHEET}</div>
        <div class="ws-prompt">${prettyMath(q.prompt)}</div>
        ${inputHtml}
        ${feedbackHtml}
      </div>
      <div class="ws-footer">
        ${current.awaitingNext
          ? `<button class="btn" style="width:100%;" onclick="nextQuestion()">${current.qIndex+1<QUESTIONS_PER_SHEET?'Próxima':'Ver resultado'}</button>`
          : `<button class="btn" style="width:100%;" onclick="submitAnswer()">Corrigir</button>`}
      </div>
    </div>
    ${lessonSheetHtml(current.sheet)}
  `;

  if(current.sheet){ const c = document.getElementById('ls-close'); if(c) c.focus({preventScroll:true}); return; }
  if(q.type!=='mc' && !current.awaitingNext){
    const inp = document.getElementById('ws-answer-input');
    inp.focus();
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submitAnswer(); });
  }
}

function formatAnswer(q){
  if(q.type==='mc') return q.options[q.answer];
  if(q.type==='text') return q.answer;
  return Number.isInteger(q.answer) ? q.answer : q.answer.toFixed(2);
}

function selectMc(i){
  current.selectedMc = i;
  render();
}

function submitAnswer(){
  const q = current.questions[current.qIndex];
  let correct = false;
  if(q.type==='mc'){
    if(current.selectedMc===null) return;
    correct = current.selectedMc===q.answer;
  } else {
    const raw = document.getElementById('ws-answer-input').value;
    if(raw.trim()==='') return;
    if(q.type==='text'){
      correct = normalizeAnswer(raw)===normalizeAnswer(q.answer);
    } else {
      const val = parseFloat(raw.replace(',','.'));
      const tol = q.tolerance || 0.001;
      correct = !isNaN(val) && Math.abs(val-q.answer)<=tol;
    }
  }
  current.lastCorrect = correct;
  if(correct) current.correctCount++;
  current.awaitingNext = true;
  current.draft = '';
  render();
}

function nextQuestion(){
  current.selectedMc = null;
  current.awaitingNext = false;
  if(current.qIndex+1 < QUESTIONS_PER_SHEET){
    current.qIndex++;
    render();
  } else {
    finishWorksheet();
  }
}

function closeWorksheet(){
  current = null;
  screen='map';
  render();
}

function finishWorksheet(){
  const totalTime = Math.round((Date.now()-current.startTime)/1000);
  const scorePct = Math.round((current.correctCount/QUESTIONS_PER_SHEET)*100);
  const passed = scorePct>=PASS_THRESHOLD;
  const medal = scorePct>=GOLD_THRESHOLD ? 'gold' : (passed ? 'silver' : null);
  const levelId = current.level.id;
  const prevBest = progress[levelId] ? progress[levelId].best : 0;
  progress[levelId] = {
    passed: passed || (progress[levelId] && progress[levelId].passed),
    best: Math.max(prevBest, scorePct),
    medal: (medal==='gold' || (progress[levelId] && progress[levelId].medal==='gold')) ? 'gold' : (passed?'silver':null)
  };
  saveProgress();
  lastResult = { scorePct, totalTime, passed, medal, avgTime: (totalTime/QUESTIONS_PER_SHEET).toFixed(1) };
  screen='results';
  render();
}

function renderResults(){
  const r = lastResult;
  let icon = '📝', title = 'Quase lá', msg = 'Abaixo de 80% — vale refazer com uma nova folha.';
  if(r.passed){
    icon = r.medal==='gold' ? '🏅' : '✓';
    title = r.medal==='gold' ? 'Excelente!' : 'Muito bem!';
    msg = 'Folha aprovada! Siga para a próxima ou escolha outra no mapa.';
  }
  app.innerHTML = `
    <div class="results">
      <div class="medal-icon">${icon}</div>
      <h2>${title}</h2>
      <div class="rmsg">${msg}</div>
      <div class="stat-row">
        <div class="stat"><div class="num">${r.scorePct}%</div><div class="lbl">acerto</div></div>
        <div class="stat"><div class="num">${r.totalTime}s</div><div class="lbl">tempo total</div></div>
        <div class="stat"><div class="num">${r.avgTime}s</div><div class="lbl">média/questão</div></div>
      </div>
      <div class="btn-row">
        ${!r.passed ? `<button class="btn" onclick="retrySameLevel()">Refazer folha</button>` : ''}
        <button class="btn ${r.passed?'':'secondary'}" onclick="backToMap()">Ver mapa</button>
      </div>
    </div>
  `;
}

function retrySameLevel(){
  openLevel(current.stageIdx, current.levelIdx);
}
function backToMap(){
  current = null;
  screen='map';
  render();
}

render();
</script>
</body>
</html>
